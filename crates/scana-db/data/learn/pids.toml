what = "Air-fuel ratio sensor 4 (a wide-range oxygen sensor): the mixture as lambda, and a voltage. Lambda 1.00 is the ideal mixture; below 1 is rich, above 1 is lean."
normal = "Close to 1.00 at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
