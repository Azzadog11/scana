what = "Air-fuel ratio sensor 3 (a wide-range oxygen sensor): the mixture as lambda, and the sensor's current. Lambda 1.00 is the ideal mixture; the current is near 0 mA there, and moves one way when rich and the other way when lean."
normal = "Lambda close to 1.00, current close to 0 mA, at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

