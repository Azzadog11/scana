what = "Air-fuel ratio sensor 5 (a wide-range oxygen sensor): the mixture as lambda, and a voltage. Lambda 1.00 is the ideal mixture; below 1 is rich, above 1 is lean."
normal = "Close to 1.00 at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x29
what = "Air-fuel ratio sensor 6 (a wide-range oxygen sensor): the mixture as lambda, and a voltage. Lambda 1.00 is the ideal mixture; below 1 is rich, above 1 is lean."
normal = "Close to 1.00 at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x2A
what = "Air-fuel ratio sensor 7 (a wide-range oxygen sensor): the mixture as lambda, and a voltage. Lambda 1.00 is the ideal mixture; below 1 is rich, above 1 is lean."
normal = "Close to 1.00 at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x2B
what = "Air-fuel ratio sensor 8 (a wide-range oxygen sensor): the mixture as lambda, and a voltage. Lambda 1.00 is the ideal mixture; below 1 is rich, above 1 is lean."
normal = "Close to 1.00 at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x2C
what = "How far the engine computer asks the EGR valve to open, which lets some exhaust back into the intake."
normal = "0 % at idle and full throttle on most cars; open at a light cruise."

[[pid]]
id = 0x2D
what = "The difference between the EGR opening asked for and the opening measured, as a percentage."
normal = "Close to 0 %."

[[pid]]
id = 0x30
what = "How many times the engine has warmed up since the codes were last cleared. A warm-up is a rise of at least 22 °C that reaches at least 70 °C."
read_with = "On a used car, a small number with readiness monitors not complete suggests someone cleared the codes recently."

[[pid]]
id = 0x31
what = "Distance driven since the codes were last cleared."
read_with = "On a used car, a short distance with readiness monitors not complete suggests someone cleared the codes recently."

[[pid]]
id = 0x32
what = "Pressure in the fuel tank's vapour (EVAP) system, in pascals. The engine computer uses it for its leak test."
normal = "Close to 0 Pa, moving a little."

[[pid]]
id = 0x34
what = "Air-fuel ratio sensor 1 (a wide-range oxygen sensor): the mixture as lambda, and the sensor's current. Lambda 1.00 is the ideal mixture; the current is near 0 mA there, and moves one way when rich and the other way when lean."
normal = "Lambda close to 1.00, current close to 0 mA, at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x35
what = "Air-fuel ratio sensor 2 (a wide-range oxygen sensor): the mixture as lambda, and the sensor's current. Lambda 1.00 is the ideal mixture; the current is near 0 mA there, and moves one way when rich and the other way when lean."
normal = "Lambda close to 1.00, current close to 0 mA, at a warm idle and a steady cruise."
read_with = "Fuel trims: the engine computer corrects towards lambda 1."

