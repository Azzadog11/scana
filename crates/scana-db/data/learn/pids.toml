read_with = "Fuel trims: the engine computer corrects towards lambda 1."

[[pid]]
id = 0x3C
what = "Catalytic converter temperature, bank 1 sensor 1. Most cars calculate it from engine speed and load rather than measure it."
normal = "About 400-800 °C once warm (typical)."

[[pid]]
id = 0x3D
what = "Catalytic converter temperature, bank 2 sensor 1. Most cars calculate it from engine speed and load rather than measure it."
normal = "About 400-800 °C once warm (typical)."

[[pid]]
id = 0x3E
what = "Catalytic converter temperature, bank 1 sensor 2. Most cars calculate it from engine speed and load rather than measure it."
normal = "About 400-800 °C once warm (typical)."

[[pid]]
id = 0x3F
what = "Catalytic converter temperature, bank 2 sensor 2. Most cars calculate it from engine speed and load rather than measure it."
normal = "About 400-800 °C once warm (typical)."

[[pid]]
id = 0x43
what = "How much air the engine takes in on each stroke, compared with its size. It can go above 100 % on a turbo engine."
normal = "About 15-30 % at a warm idle (typical)."
read_with = "Calculated engine load: on an engine without a turbo the two are close at part throttle."

[[pid]]
id = 0x44
what = "The mixture the engine computer asks for, as lambda. 1.00 is the ideal mixture; below 1 is rich (cold starts, full throttle), above 1 is lean."
normal = "1.00 in closed loop."

[[pid]]
id = 0x48
what = "A third throttle position sensor reading, on cars that have one."

[[pid]]
id = 0x4B
what = "A third accelerator pedal sensor reading, on cars that have one."

[[pid]]
id = 0x51
what = "The fuel the engine is built for: petrol, diesel, LPG, ethanol, a hybrid and so on."

[[pid]]
id = 0x52
what = "How much ethanol is in the fuel, on flex-fuel cars that measure it."

[[pid]]
id = 0x53
what = "Absolute pressure in the fuel tank's vapour (EVAP) system."
normal = "Close to the air pressure outside."

[[pid]]
id = 0x54
what = "Pressure in the fuel tank's vapour (EVAP) system, in pascals, with a wider range than PID 32."
normal = "Close to 0 Pa."

[[pid]]
id = 0x55
what = "Short term fuel trim from the oxygen sensor after the converter (banks 1 and 3): a small extra correction on top of the main fuel trims."
normal = "Close to 0 %."

[[pid]]
id = 0x56
what = "Long term fuel trim from the oxygen sensor after the converter (banks 1 and 3): a small extra correction on top of the main fuel trims."
normal = "Close to 0 %."

[[pid]]
id = 0x57
what = "Short term fuel trim from the oxygen sensor after the converter (banks 2 and 4): a small extra correction on top of the main fuel trims."
normal = "Close to 0 %."

[[pid]]
id = 0x58
what = "Long term fuel trim from the oxygen sensor after the converter (banks 2 and 4): a small extra correction on top of the main fuel trims."
normal = "Close to 0 %."

[[pid]]
id = 0x59
what = "Fuel rail pressure (absolute), mostly on direct-injection and diesel engines."
normal = "Varies by engine and load: see the workshop manual."

[[pid]]
id = 0x5A
what = "Accelerator pedal position, scaled so a released pedal reads 0 %."
normal = "0 % with the foot off the pedal."

[[pid]]
id = 0x5B
what = "A percentage for the hybrid battery, on hybrids. The standard calls it the remaining life; many cars report the state of charge here (unverified)."

[[pid]]
id = 0x5D
what = "When the injectors fire, in degrees of crankshaft rotation: mostly diesel engines."

[[pid]]
id = 0x5F
what = "The emission standard the vehicle was built to, on heavy vehicles."

[[pid]]
id = 0x61
what = "The torque the driver asks for with the pedal, as a share of the engine's reference torque (PID 63)."

[[pid]]
id = 0x62
what = "The torque the engine makes, as a share of its reference torque (PID 63)."
read_with = "Driver's demanded torque: the gap shows what the engine computer is holding back."

[[pid]]
id = 0x63
what = "The torque that 100 % means for the two torque values (PIDs 61 and 62)."
