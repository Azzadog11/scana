[[topic]]
id = "pattern-vacuum-leak"
title = "Vacuum leak in live data"
group = "live-data"
aliases = ["vacuum leak", "intake leak", "unmetered air", "false air"]
summary = "Air that enters the engine after the air flow sensor makes it run lean, mostly at idle."
body = [
  "A vacuum leak lets extra air into the intake after the air flow sensor. The engine computer cannot see that air, so it does not add fuel for it. The mixture goes lean.",
  "The computer then adds fuel to correct it. The result is high positive fuel trims. The leak matters most at idle, where little air flows and a small hole is a big share of it.",
  "At 2500 rpm much more air flows through the proper path, so the same hole is a small share. The trims fall.",
]
how_to_read = [
  "Warm the engine until it is in closed loop. Note the fuel trims at idle, then hold 2500 rpm with no load and note them again.",
  "A leak shows trims that are high at idle and much lower at 2500 rpm. One workshop guide treats a fall of at least 15 percentage points as a vacuum leak. Another example shows +25 % at idle falling to +4 % at 1500 and 2500 rpm.",
  "A lean code usually sets only when total trim (short term plus long term) passes about +20 % on one bank.",
  "Do not trust the air flow (MAF) reading to find a leak. It often just reacts to the leak.",
  "Compare banks. One bank high and the other normal points to a leak on that bank. Both banks high points to a shared cause.",
  "To confirm: a smoke test pushes smoke into the intake and shows the leak. The older method sprays carburettor cleaner or propane near joints: the idle changes when the engine draws it in. Sprays are a fire risk near a hot exhaust, so keep them short.",
]
faults = [
  "Common leak points: cracked vacuum hoses, intake manifold gaskets, throttle body gaskets, the boot between the MAF sensor and the throttle, PCV hoses and the brake booster hose.",
  "Look-alike: a dirty MAF sensor. Trims stay high at 2500 rpm and under load.",
  "Look-alike: low fuel pressure. Trims get worse as load rises.",
  "Look-alike: an exhaust leak before the front oxygen sensor.",
]
related = ["fuel-trim", "pattern-maf-fault", "pattern-exhaust-leak", "pattern-fuel-delivery", "test-conditions", "guide:lean", "code:P0171"]
sources = [
  "MOTOR Information Systems, 'Lean On Me' (read 2026-10-16)",
  "AVI OnDemand, 'Fuel Trim Diagnosis And O2 Sensor Performance' (read 2026-10-16)",
  "2CarPros, 'How to Repair Lean Exhaust Codes' (read 2026-10-16)",
  "APEX Tech Nation, 'Fuel Trim Diagnostics Explained' (read 2026-10-16)",
]

[[topic]]
id = "pattern-maf-fault"
title = "Dirty or failing MAF in live data"
group = "live-data"
aliases = ["dirty MAF", "faulty MAF", "MAF fault", "MAF cleaning"]
summary = "A MAF sensor that reads low makes the engine computer under-fuel, so trims run high at every speed."
body = [
  "The mass air flow (MAF) sensor measures the air the engine takes in. Dirt or oil on its sensing element makes it read too low. The computer adds too little fuel and the mixture goes lean.",
  "The computer corrects with positive fuel trims. Unlike a vacuum leak, the trims stay high at 2500 rpm and under load.",
]
how_to_read = [
  "Trims lean at idle, still lean at 2500 rpm and lean under load, often on both banks.",
  "Air flow in g/s looks low for the engine size. One guide gives about 2 to 7 g/s at warm idle for small four-cylinders and 4 to 10 g/s for V6 and V8 engines. Another says the idle reading in g/s should roughly match the engine size in litres. Both are rough rules: check the workshop manual.",
  "The reading should rise smoothly with rpm and load. It should not freeze or spike.",
  "In a throttle test the MAF signal should follow the throttle position signal closely.",
  "Cleaning check: record the idle values, clean the sensing element with MAF cleaner spray, let it dry, then record again. A large change confirms the sensor was dirty.",
  "Rule out leaks first. A vacuum leak, a misfire or a cracked intake boot can make the MAF reading look wrong.",
]
faults = [
  "Dirty element: low g/s, lean trims, hesitation.",
  "Air filter or intake boot problems, or a corroded connector, can disturb the reading.",
  "A MAF that reads too high does the opposite: negative trims and a rich mixture.",
  "Codes P0100 to P0104 point to the MAF circuit or range.",
]
related = ["maf-reading", "maf-sensor", "pattern-vacuum-leak", "pattern-fuel-delivery", "using-graphs", "guide:maf", "pid:10"]
sources = [
  "ThinkCar, 'How to Test a MAF Sensor with an OBD2 Scanner' (read 2026-10-16)",
  "MOTOR Information Systems, 'Lean On Me' (read 2026-10-16)",
  "APEX Tech Nation, 'Fuel Trim Diagnostics Explained' (read 2026-10-16)",
]

[[topic]]
id = "pattern-fuel-delivery"
title = "Weak fuel supply in live data"
group = "live-data"
aliases = ["weak fuel pump", "low fuel pressure", "fuel starvation", "clogged fuel filter"]
summary = "If the fuel pump or filter cannot keep up, the engine runs lean and gets worse as the load rises."
body = [
  "A weak fuel pump, a blocked filter or a failing pressure regulator cannot deliver enough fuel when the engine asks for most. The mixture goes lean when demand is highest.",
  "In live data this looks like fuel trims that rise with load and rpm. The engine may feel fine at idle and hesitate or lose power when you accelerate hard.",
]
how_to_read = [
  "Trims lean at idle and worse at 2500 rpm and under load. A vacuum leak does the opposite.",
  "One workshop guide calls short term trim above +8 % or long term trim above +10 % a lean sign that can come from low fuel pressure or a weak pump. Trims within about 5 % are normal.",
  "Lean codes (P0171, P0174) that set under acceleration point to supply, not to a leak.",
  "Test with a fuel pressure gauge. Compare idle pressure with the maker's figure. A pump can pass at idle but fail when demand is high.",
  "A dead-head test (return line pinched, for pumps where that is safe) should give about double the idle pressure. A volume test should give about three quarters of a quart to one quart (about 0.7 to 0.95 litre) in 30 seconds.",
  "Check the voltage at the pump. Low voltage cuts flow even with a good pump.",
]
faults = [
  "Look-alike: a dirty MAF sensor. Trims are high at idle too.",
  "Look-alike: a restricted injector, with misfire on one cylinder.",
  "Look-alike: an exhaust leak before the front oxygen sensor.",
  "Pressure that is too high points the other way: a bad regulator or a blocked return line, and a rich mixture.",
]
related = ["fuel-system", "fuel-trim", "pattern-maf-fault", "pattern-vacuum-leak", "pattern-exhaust-leak", "guide:fuel-pressure", "guide:lean"]
sources = [
  "AA1Car.com, 'Diagnose Fuel Pump' (read 2026-10-16)",
  "AVI OnDemand, 'Fuel Trim Diagnosis And O2 Sensor Performance' (read 2026-10-16)",
  "APEX Tech Nation, 'Fuel Trim Diagnostics Explained' (read 2026-10-16)",
]

[[topic]]
id = "pattern-rich"
title = "Running rich in live data"
group = "live-data"
aliases = ["running rich", "rich condition", "rich running", "rich mixture"]
summary = "Too much fuel shows as negative trims and a front oxygen sensor reading high."
body = [
  "A rich engine gets more fuel than the air needs. The oxygen sensor sees little oxygen in the exhaust, so it reads high. The computer cuts fuel to correct it, which gives negative fuel trims.",
  "A rich engine wastes fuel and can overheat the catalytic converter.",
]
how_to_read = [
  "Short and long term fuel trims below zero. Long term trim beyond about -10 % points to a real fault.",
  "If both short term and long term trims are negative, the rich condition is steady, not a one-off.",
  "Front oxygen sensor reads high (above about 0.45 V) most of the time.",
  "Check the coolant temperature reading. A sensor that reads colder than the engine really is makes the computer add fuel.",
  "Check fuel pressure. High pressure points to a regulator fault or a blocked return line. Normal pressure with a pressure that drops fast after shut-off points to a leaking injector.",
  "Check the purge valve: remove the hoses with the engine off and blow through it. Air should not pass.",
]
faults = [
  "Leaking injector: rich at idle, fuel smell, fuel in the oil. A single fouled plug points to that cylinder.",
  "High fuel pressure from a faulty regulator or a restricted return line.",
  "Purge valve stuck open. See pattern-evap-purge.",
  "Coolant temperature sensor reading cold. See pattern-ect-sensor.",
  "A contaminated MAF sensor that reads high, or a badly blocked air filter.",
  "Do not replace parts from trims alone. Trims show the effect, not the cause.",
]
related = ["fuel-trim", "pattern-evap-purge", "pattern-ect-sensor", "pattern-thermostat", "o2-sensor-reading", "guide:rich", "code:P0172"]
sources = [
  "Ricks Free Auto Repair Advice, 'What Does Negative Fuel Trim Mean? Expert Diagnosis Guide' (read 2026-10-16)",
  "APEX Tech Nation, 'Fuel Trim Diagnostics Explained' (read 2026-10-16)",
