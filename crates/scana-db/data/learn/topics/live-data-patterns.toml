]

[[topic]]
id = "pattern-thermostat"
title = "Thermostat stuck open in live data"
group = "live-data"
aliases = ["thermostat stuck open", "slow warm-up", "engine not reaching temperature"]
summary = "A thermostat stuck open keeps the engine cool: slow warm-up, a low temperature reading and code P0128."
body = [
  "The thermostat holds coolant in the engine until it reaches working temperature, then opens. If it sticks open, coolant flows to the radiator all the time and the engine warms slowly or never fully warms.",
  "The engine computer expects the coolant to reach working temperature within a set time. If it does not, it sets code P0128.",
]
how_to_read = [
  "Record a cold start in Graphs and watch the coolant temperature curve. A healthy engine reaches its working range (the thermostat opens at about 82 to 90 degrees C) in about 10 to 15 minutes of driving.",
  "One guide says to suspect the thermostat if coolant stays below about 71 degrees C after more than 15 minutes of driving.",
  "Other signs: the dash gauge stays low, the cabin heater blows weak or cold, and fuel use rises because a cold engine runs richer.",
  "A faulty coolant sensor can give the same code. Compare the scan tool value with an infrared thermometer on the upper radiator hose. A big mismatch points to the sensor.",
]
faults = [
  "Look-alike: a coolant temperature sensor or intake air temperature sensor that reads wrong. See pattern-ect-sensor.",
  "Look-alike: low coolant, a cooling fan that stays on, or a failing water pump.",
  "A thermostat stuck closed does the opposite: fast heating and overheating.",
]
related = ["coolant-temp-reading", "pattern-ect-sensor", "cooling-system", "using-graphs", "guide:thermostat", "code:P0128"]
sources = [
  "The Motor Guy, 'P0128 Code: Coolant Thermostat Fault' (read 2026-10-16)",
  "Carista, 'P0128 Code Explained: Causes and Fixes' (read 2026-10-16)",
]

[[topic]]
id = "pattern-misfire"
title = "Misfire in live data"
group = "live-data"
aliases = ["misfire pattern", "cylinder misfire", "random misfire"]
summary = "A misfire shows as per-cylinder counts, an rpm stumble, and a front oxygen sensor that can read lean."
body = [
  "A misfire is a cylinder that does not burn its fuel properly. The engine computer sees it as a brief slowdown of the crankshaft and counts it for that cylinder.",
  "A misfire sends unburned air and fuel into the exhaust. A steady misfire can overheat and damage the catalytic converter.",
]
how_to_read = [
  "Test results (mode 06): misfire counts per cylinder. Counts rising on one cylinder point to that cylinder: ignition, injector or compression.",
  "Counts spread across all cylinders (random misfire) point to something shared: air measurement, fuel delivery or a vacuum leak.",
  "Graph engine speed while the fault happens. A misfire shows as a stumble or dip in rpm.",
  "A misfire sends unburned oxygen into the exhaust, so the oxygen sensor can read lean even when fuel supply is fine. Trims then show short, unstable spikes instead of a steady shift.",
  "A flashing warning light means a severe misfire that can damage the catalytic converter. Cut speed and load and get it fixed soon. Stop if there is heavy shaking or a strong fuel smell.",
  "Codes: P0300 is random or multiple cylinders. P0301 and up name one cylinder.",
]
faults = [
  "Worn spark plug or weak coil: counts on one cylinder, often worse under load. Swapping the coil with another cylinder shows if the misfire follows it.",
  "Blocked or stuck injector: counts on one cylinder.",
  "Low compression: counts on one cylinder at idle.",
  "Look-alike: a lean mixture from a leak or weak fuel supply gives random counts.",
]
related = ["mode06-reading", "ignition-system", "fuel-injectors", "pattern-catalyst", "term:Misfire", "guide:misfire", "page:tests"]
sources = [
  "Review Friendly, 'How to Diagnose a Misfire With Live Data: 2026 complete Guide' (read 2026-10-16)",
  "Identifix, 'P0300 Code: The Guide to Diagnostics and Repair' (read 2026-10-16)",
]

[[topic]]
id = "pattern-catalyst"
title = "Worn catalytic converter in live data"
group = "live-data"
aliases = ["worn catalytic converter", "catalyst efficiency", "failing catalytic converter", "P0420 pattern"]
summary = "A worn converter shows as a rear oxygen sensor that copies the front one, and code P0420."
body = [
  "A healthy converter stores oxygen. The front oxygen sensor switches quickly between rich and lean, but the rear sensor stays fairly steady because the converter smooths the exhaust.",
  "As the converter wears, it stores less oxygen. The rear sensor starts to follow the front one. The engine computer sees this and sets P0420 (bank 1) or P0430 (bank 2).",
]
how_to_read = [
  "Graph both sensors warm, at a steady 2500 rpm. The front sensor should cross 0.45 V several times per second. The rear sensor should hold fairly flat, around 0.5 to 0.7 V, with slow movement.",
  "If the rear sensor switches like the front one, the converter has lost its oxygen storage.",
  "Test results (mode 06): the catalyst monitor shows the measured value and the pass limit. A result near the limit means a marginal converter. A clear fail confirms it.",
  "Rule out other causes before replacing it: a lazy or faulty rear sensor, an exhaust leak, fuel trim faults, misfire, oil use or coolant leaking in.",
]
faults = [
  "Look-alike: an exhaust leak between the converter and the rear sensor. It lets air dilute the sample so the rear sensor copies the front one.",
  "Look-alike: a failed or lazy rear oxygen sensor.",
  "Causes of wear: misfire, burning oil, coolant leaking in, long periods of rich or lean running.",
]
related = ["catalytic-converter", "o2-sensor-reading", "pattern-o2-lazy", "pattern-exhaust-leak", "pattern-misfire", "guide:catalyst", "code:P0420"]
sources = [
  "APEX Tech Nation, 'P0420: Never Condemn the Cat First. Check These 3 Things' (read 2026-10-16)",
  "Identifix, 'P0300 Code: The Guide to Diagnostics and Repair' (read 2026-10-16)",
]

[[topic]]
id = "pattern-exhaust-leak"
title = "Exhaust leak before the front sensor in live data"
group = "live-data"
aliases = ["exhaust leak", "manifold leak", "exhaust manifold crack"]
summary = "A leak before the front oxygen sensor lets air in and can make the sensor read falsely lean."
body = [
  "Exhaust leaves the engine in pulses, and between the pulses the pressure in the pipe drops. A crack or bad gasket before the front oxygen sensor can draw outside air in at those moments.",
  "The sensor sees extra oxygen and reads lean, even if the mixture is right. The computer may add fuel, and the engine can then run rich.",
]
how_to_read = [
  "Positive fuel trims and a lean front sensor, with no vacuum leak found.",
  "A ticking or puffing sound from the exhaust, loudest on a cold start. It fades as the metal warms and expands and seals the gap.",
  "The effect on trims is not certain. Technicians report that big leaks sometimes change nothing, while small pinhole leaks sometimes cause lean codes. It depends on the exhaust layout and the size of the leak.",
  "To find a leak: with a helper holding about 1500 rpm, listen along the manifold and head pipe. Black soot around a joint or a broken stud also marks a leak. Never touch the manifold: it burns within a minute or two.",
  "A leak near the rear sensor can also set a false P0420.",
]
faults = [
  "Look-alike: a vacuum leak. It gives high trims at idle that fall at 2500 rpm.",
  "Look-alike: weak fuel supply. Trims rise with load.",
  "Look-alike: a misfire, which also pushes oxygen into the exhaust.",
]
related = ["pattern-vacuum-leak", "o2-sensor-reading", "pattern-catalyst", "fuel-trim", "guide:lean"]
sources = [
  "2CarPros, 'How to Repair Lean Exhaust Codes' (read 2026-10-16)",
  "ScannerDanner forum, 'Exhaust Leak Cause Lean or Rich?' (read 2026-10-16)",
  "Mobile Mechanic Auto Repair, 'Ticking on Cold Start: Exhaust Leak or Something Worse?' (read 2026-10-16)",
]

[[topic]]
id = "pattern-o2-lazy"
title = "Slow oxygen sensor in live data"
group = "live-data"
aliases = ["lazy oxygen sensor", "slow oxygen sensor", "slow O2 sensor", "sensor response"]
summary = "An ageing oxygen sensor switches slowly or rarely, so the engine computer holds the mixture less well."
body = [
  "A healthy narrow-band sensor swings quickly between about 0.1 and 0.9 V while the engine runs in closed loop. An ageing sensor slows down. Oil ash, silicone from sealant or heat cycling coat or wear its element.",
  "A slow sensor makes the computer correct late. A code for slow response, P0133 on the front sensor of bank 1, may set.",
]
how_to_read = [
  "Count the crossings of 0.45 V. At a steady 2500 rpm, a healthy sensor crosses about 6 to 10 times in 10 seconds, and a lazy one about 1 to 3. At closed-loop idle one guide gives 8 to 20 crossings in 10 seconds as healthy and under 5 or 6 as lazy. Record 30 to 60 seconds and count on playback.",
  "A lazy trace looks like a soft, rounded wave, not sharp steps. Its peaks may not reach the usual high and low.",
  "Snap-throttle test: open and release the throttle quickly. A healthy sensor follows within about 100 to 300 ms. A lazy one takes 600 ms or longer.",
  "Test results (mode 06) may list sensor switch times and limits for the maker. The limits vary by car (unverified).",
  "Figures differ by car and by how the computer controls fuel: the workshop manual decides.",
]
faults = [
  "Look-alike: a real lean condition, such as a vacuum leak or low fuel pressure, that keeps the sensor lean longer.",
  "Look-alike: a small exhaust leak before the sensor.",
  "Look-alike: a misfire or vacuum leak that makes the idle unstable, so the trace looks messy.",
  "A slow update rate in the scan tool can also make a good sensor look lazy.",
]
related = ["o2-sensor-reading", "o2-sensor", "pattern-catalyst", "using-graphs", "mode06-reading", "guide:o2-sensor", "code:P0133"]
sources = [
  "APEX Tech Nation, 'Oxygen Sensor Testing: How to Use a Scan Tool and Scope to Verify Sensor Health' (read 2026-10-16)",
  "APEX Tech Nation, 'P0133 & P0134: O2 Sensor Slow Response / No Activity (Bank 1 Sensor 1)' (read 2026-10-16)",
]

[[topic]]
id = "pattern-charging"
title = "Charging faults in live data"
group = "live-data"
aliases = ["charging fault", "low charging voltage", "alternator fault", "battery voltage pattern"]
summary = "Running voltage that stays under about 13 V or over about 15 V points to a fault, but smart charging varies on purpose."
body = [
  "With the engine running, the alternator charges the battery. A typical reading is 13.5 to 14.5 V. A fully charged battery at rest, engine off, reads about 12.6 V.",
  "Many newer cars use smart charging. The engine computer lowers alternator output when you accelerate and raises it when you brake or coast. The voltage moves up and down on purpose.",
]
how_to_read = [
  "Voltage that swings between about 12.5 V and 15 V during a drive is normal for smart charging. A drop to about 12.5 V under hard acceleration and a rise to about 15 V on overrun are not faults. Cold weather also raises it.",
  "A full, warm battery may get low voltage for long stretches on purpose.",
  "A fault looks like this: never above about 13 V, so the battery never charges. Or staying above about 15 V. Or no change under any condition, or voltage that collapses under load.",
  "A single reading at idle cannot tell normal from faulty. Record voltage through a whole drive in Graphs, with acceleration and overrun.",
  "Low voltage can set odd codes in other modules. Fix the charging first.",
]
faults = [
  "Worn alternator or faulty regulator: low, high or erratic voltage.",
  "Loose belt, poor earth or a loose battery terminal: voltage jumps and drops.",
  "A flat battery after charging: the battery may be at the end of its life even if the alternator is fine.",
]
related = ["voltage-reading", "charging-system", "battery", "guide:charging", "guide:flat-battery", "pid:42"]
sources = [
  "OBD LLM, 'Smart alternator variable voltage' (read 2026-10-16)",
  "Jiffy Lube, 'What Is Car Battery Voltage?' (read 2026-10-16)",
]

[[topic]]
id = "pattern-evap-purge"
title = "Purge valve stuck open in live data"
group = "live-data"
aliases = ["purge valve stuck open", "stuck purge valve", "purge valve leak"]
summary = "A purge valve stuck open feeds fuel vapour in when it should not, giving a rough idle, mainly after refuelling."
body = [
  "The purge valve lets fuel vapour from the charcoal canister into the intake. It should stay closed at idle and for the first minutes after start.",
  "If it sticks open, vapour and air flow in all the time. The idle becomes rough or hunts, and the engine may stall when you stop.",
]
how_to_read = [
  "Classic pattern: the car runs badly for the first minute after refuelling, then improves. Refuelling pushes vapour into the canister, and an open valve dumps it into the intake. Hard starting after a fill-up fits too.",
  "Fuel trims: sources disagree. Extra vapour should make the mixture rich and pull trims negative. One source also reports trims of about +10 % at idle, because the open valve adds air the computer never measured. Trims that improve at higher rpm fit either case.",
  "Line block test: pinch or block the canister line at idle. If the idle smooths, the vapour path is the cause.",
  "Bench test: with no power on the valve, you should not be able to blow air through it. Any flow means it is stuck open.",
  "Scan tool test: command the purge valve on at idle. A stumble is normal. No change means the valve is not opening, or was already open.",
]
faults = [
  "Codes for purge flow or valve circuit may set, for example P0496 for high purge flow.",
  "Look-alike: a leaking injector or high fuel pressure give rich trims too, but not only after refuelling.",
]
related = ["evap-system", "pattern-rich", "fuel-trim", "guide:evap-purge", "term:Purge valve", "code:P0496"]
sources = [
  "APEX Tech Nation, 'EVAP Purge Valve: Testing, Replacement, and the Hose Everyone Fights' (read 2026-10-16)",
  "Foxwell, 'Purge Valve: Symptoms, Testing, Live Data Analysis and Common Trouble Codes' (read 2026-10-16)",
  "Ricks Free Auto Repair Advice, 'What Does Negative Fuel Trim Mean? Expert Diagnosis Guide' (read 2026-10-16)",
]

[[topic]]
id = "pattern-ect-sensor"
title = "Coolant temperature sensor reading wrong"
group = "live-data"
aliases = ["wrong coolant temperature", "ECT sensor fault", "coolant sensor reads wrong", "coolant temperature sensor fault"]
summary = "A wrong coolant temperature changes fuelling and fan control. Compare it with intake air temperature on a cold engine."
body = [
  "On an engine that has stood for hours, every part is at air temperature. The coolant temperature and the intake air temperature should then agree.",
  "The engine computer uses coolant temperature for cold-start fuelling, fan control and its warm-up checks. A wrong value upsets all of these.",
]
how_to_read = [
  "Cold check: read both temperatures with the engine cold, key on. They should match within a degree or two. A big gap means one sensor is bad. Sun on the intake or a recent drive can skew it, so wait for a true cold soak.",
  "Warm-up check: start the engine. Coolant should rise steadily while intake air stays about the same. A coolant reading that does not move points to a bad sensor.",
  "A reading near 5 V at the sensor suggests an open circuit. A reading near 0 V suggests a short or lost reference voltage.",
  "Reads too cold: the computer runs the engine rich, wasting fuel. Reads too hot: cold-driveability trouble such as stalling, hesitation and rough idle.",
  "The fan: the computer switches the fan from the coolant reading. A faulty sensor may not start the fan when the engine is hot, and the engine can overheat.",
]
faults = [
  "Look-alike: a thermostat stuck open gives a true low temperature. See pattern-thermostat.",
  "Compare the scan tool value with an infrared thermometer on the upper radiator hose to find a sensor that reads in range but wrong.",
  "Codes P0115 to P0119 cover the coolant sensor circuit.",
]
related = ["coolant-temp-reading", "coolant-temp-sensor", "intake-air-temp", "pattern-thermostat", "key-on-engine-off", "guide:coolant-sensor", "pid:05"]
sources = [
  "AA1Car.com, 'How to Check & Replace an Engine Coolant Sensor' (read 2026-10-16)",
  "The Motor Guy, 'P0128 Code: Coolant Thermostat Fault' (read 2026-10-16)",
]

[[topic]]
id = "pattern-boost-leak"
title = "Boost leak in live data"
group = "live-data"
aliases = ["boost leak", "turbo leak", "intercooler leak", "underboost"]
summary = "A boost leak lets turbo pressure escape, so boost stays below the desired value under load."
body = [
  "On a turbo engine, pipes carry compressed air from the turbo through the intercooler to the intake. A split hose, a loose clamp or a bad intercooler seam lets that air escape.",
  "The engine feels slow and may hiss or whistle under load. A code for low boost, such as P0299, may set.",
]
how_to_read = [
  "Compare desired and actual boost (manifold pressure) in Graphs on a loaded road test. If actual falls behind the request as load rises, a leak is likely.",
  "A turbo that is not making boost shows lower air flow (MAF) than expected for the throttle position. Check that the manifold pressure sensor agrees with the barometric reading key on, engine off, so a biased sensor does not mimic a leak.",
  "Fuel trims above about +10 % under boost point to unmetered air entering the system.",
  "A smoke test at idle can miss leaks that open only under boost pressure. Use a regulated pressure test at the maker's figure, with soapy water or smoke, engine off.",
  "Black smoke on acceleration and poor fuel economy can go with it.",
]
faults = [
  "Look-alike: a stuck wastegate, a faulty boost control solenoid or a failing turbo. These make the same low boost without a leak.",
  "Look-alike: a blocked air filter, a restricted exhaust or a fuel fault.",
  "A leak does not prove itself from a low-boost code alone.",
]
related = ["turbocharger", "map-reading", "maf-reading", "diesel-live-data", "key-on-engine-off", "term:Boost"]
sources = [
  "APEX Tech Nation, 'Turbocharger Diagnosis: Underboost, Oil Leaks, and Shaft Play' (read 2026-10-16)",
  "WC Turbos, 'How to Identify Boost Leaks in Diesel Engines' (read 2026-10-16)",
]

[[topic]]
id = "diesel-live-data"
title = "Reading diesel live data"
group = "live-data"
aliases = ["diesel live data", "diesel data", "rail pressure", "fuel rail pressure", "injector correction", "DPF differential pressure", "soot load"]
summary = "Diesel data adds rail pressure, boost, EGR, soot load and injector corrections, most with a desired and an actual value."
body = [
  "A diesel controls power by how much fuel it injects, not by a throttle. Its computer watches fuel pressure, boost, EGR and the exhaust filter instead of oxygen-sensor trims.",
  "Many values come as pairs: desired (what the computer asks for) and actual (what the sensor reads). The gap between them is the clue.",
]
how_to_read = [
  "Rail pressure: actual should track desired closely, and should hold steady at idle. One guide gives roughly 5000 psi (about 350 bar) at idle and 35,000 psi (about 2400 bar) or more at full throttle, depending on the engine. Another says there is no universal idle figure. A gap that widens under load points to a weak pump, a supply restriction or leaking injectors. With the key on, engine off, rail pressure should read near zero.",
  "Boost: compare desired with actual under load. Slow build, failure to hold or no build each point to different causes. See pattern-boost-leak.",
  "EGR: commanded and actual position should agree. If the computer commands it closed at idle but it shows partly open, the valve may be stuck open, which can give rough idle, stalling and hard hot starts. Commanding it open at idle should make a healthy engine stumble.",
  "DPF differential pressure: one guide gives about 2 to 10 mbar at warm idle and about 30 to 40 mbar at 3000 rpm with no load. Higher means a blocked filter. Near zero may mean a damaged filter. Compare with the maker's figure at the same rpm.",
  "DPF soot load: the computer's estimate of how full the filter is. One guide says above 100 % forces a regeneration or sets a code.",
  "Injector corrections: per-cylinder fuel trims. A positive value means the computer adds fuel to that cylinder. One cylinder far from the others points to that injector. Compare only under matching conditions.",
]
faults = [
  "Not every diesel reports every value through standard OBD. Many need maker-specific access.",
  "Look-alike: a clogged air filter or intake restriction lowers boost and air flow together.",
]
related = ["dpf", "egr-system", "turbocharger", "pattern-boost-leak", "scr-adblue", "term:Common rail", "guide:dpf", "guide:egr"]
sources = [
