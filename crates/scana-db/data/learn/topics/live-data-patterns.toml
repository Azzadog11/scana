[[topic]]
id = "hybrid-live-data"
title = "Hybrids in live data"
group = "live-data"
aliases = ["hybrid live data", "hybrid scan tool", "engine stops at idle", "state of charge", "SoC"]
summary = "A hybrid's petrol engine often stops, so zero rpm in live data can be normal."
body = [
  "Many hybrids shut the petrol engine off when the car is stopped or can run on the battery. So engine rpm of 0 with the car on and ready is normal. It is not a fault.",
  "The engine restarts on its own when the battery needs charge or the car needs power. Keep hands and tools away from belts and fans even when the engine looks off.",
  "A standard scan tool reads engine data. Battery and motor data usually sit in separate computers and often need maker-specific access.",
]
how_to_read = [
  "Engine-only values such as rpm, air flow and fuel trims read 0 or drop out while the engine is off. They return when it restarts. Fuel trim and oxygen sensor checks need the engine running and warm.",
  "State of charge shows how full the high-voltage battery is. On one Prius test the engine started near 40 % and stopped near 50 %. The range differs by make and model.",
  "Useful battery data on cars that report it: state of charge, battery current, and the highest and lowest cell block voltages. A large gap between blocks suggests a weak battery.",
  "A weak 12 V battery can cause odd faults. Check it first.",
]
faults = [
  "Look-alike: rpm of 0 or no data in electric mode. It is not a sensor fault.",
  "High voltage can injure or kill. Pack voltages run from about 100 V to several hundred volts, and the cables are usually orange. A scan tool reading is safe. Do not touch orange cables or open the battery without training.",
]
related = ["hybrid-system", "rpm-idle", "readiness-monitors", "test-conditions", "reading-live-data", "page:live"]
sources = [
  "Wikipedia, 'Hybrid electric vehicle' (read 2026-10-16)",
  "AA1Car.com, 'Hybrid Vehicle Safety Hazards' (read 2026-10-16)",
  "Art's Automotive, 'Hybrid Battery Testing & Health Checks' (read 2026-10-16)",
]

[[topic]]
id = "fuel-types"
title = "Fuel types and live data"
group = "live-data"
aliases = ["fuel type", "E10", "ethanol", "ethanol percentage", "LPG", "flex fuel", "petrol and ethanol"]
summary = "Different fuels change the ideal air-fuel ratio and how trims and lambda read; PID 51 reports the fuel type."
body = [
  "Each fuel has its own ideal air-fuel ratio by weight. Petrol is 14.7:1. E10 (petrol with 10 % ethanol) is about 14.1:1, which is about 4 % more fuel for the same air. Pure ethanol is 9:1, and E85 is about 9.8:1.",
  "Lambda removes the difference. Lambda 1.00 is the ideal mixture on any fuel. A tool that shows air-fuel ratio in numbers usually assumes petrol, so it can look wrong on other fuels.",
]
how_to_read = [
  "Fuel type (PID 51): a number. 1 petrol, 2 methanol, 3 ethanol, 4 diesel, 5 LPG, 6 CNG, 7 propane. 9 to 14 are bi-fuel cars running on petrol, methanol, ethanol, LPG, CNG or propane. 17 to 22 are hybrid types. Many cars do not report it.",
  "Ethanol percent (PID 52): 0 to 100 %. Flex-fuel cars report it. Most petrol cars do not.",
  "On a car built for it, E10 is a small change that the engine computer absorbs through its trims. On flex-fuel cars the computer relearns after a refuel with a different blend.",
  "LPG: a gas kit has its own computer. It takes the petrol injector signal, adjusts it, and drives the gas injectors. The car starts on petrol and switches to gas when the coolant is warm. It also feeds the petrol computer a signal in place of the injectors so no fault codes set. Note which fuel the car used during a test.",
  "Diesel: the ideal ratio is about 14.5:1, but a diesel runs far leaner, from about 18:1 to 70:1. So its lambda reads well above 1. See diesel-live-data.",
]
faults = [
  "Look-alike: stale or bad fuel causes rough running that has nothing to do with fuel type.",
  "Gas kits can disturb the petrol trims if they are poorly set up. Large short term trims on gas mean the gas tune needs adjusting.",
]
related = ["lambda", "fuel-trim", "diesel-live-data", "closed-loop", "pid:51", "pid:52", "term:Lambda"]
sources = [
  "Wikipedia, 'OBD-II PIDs' (read 2026-10-16)",
  "AA1Car.com, 'Engine Air/Fuel Ratios' (read 2026-10-16)",
  "LPG Auto Power, 'Tell me about LPG Injection' (read 2026-10-16)",
]

[[topic]]
id = "using-graphs"
title = "Using graphs to find faults"
group = "live-data"
aliases = ["graphs", "recording a drive", "record and replay", "data logging", "datalog"]
summary = "Graphs show how values move together over time, which finds faults a single reading hides."
body = [
  "A number on the screen shows one moment. A graph shows what rose, what fell and what came first.",
  "Pick a few values that should be related and plot them together. Record a drive with the fault happening, then study it.",
]
how_to_read = [
  "Keep the list short. About 6 to 12 values are easier to read than everything the car offers. Fewer values often update faster, but it is not guaranteed, so check the real update rate.",
  "Correlation: values that move together suggest a link worth testing. It does not prove the cause. Air flow and manifold pressure, or throttle and rpm, should move together.",
  "Look for pattern shifts, not just one big reading: swinging trims, a sensor that flattens out, a counter that starts to climb, brief voltage dips.",
  "Record when the symptom is present and when it is not. The value that differs between the two is your lead.",
  "Read the scale and units before you judge a trace. Automatic scaling can make small changes look big.",
  "Before and after: keep the first recording. After the repair, record again with the same values and similar conditions. For example, trims of +17 % before an intake gasket repair and +2 % after show the repair worked.",
  "In Scana, use Graphs to plot and Record to save a drive.",
]
faults = [
  "A slow update rate can hide a short glitch or make a good sensor look flat. A graph of scan data is not an oscilloscope trace of the wire.",
  "Two recordings made in different conditions cannot be compared fairly.",
]
related = ["update-rates", "test-conditions", "reading-live-data", "page:graphs", "pattern-o2-lazy", "pattern-thermostat"]
sources = [
  "iCarsoft, 'How to Read Live Data on a Scan Tool: PIDs, Graphs and Baselines' (read 2026-10-16)",
  "ThinkCar, 'Using Live Data to Diagnose Intermittent Issues' (read 2026-10-16)",
]

[[topic]]
id = "key-on-engine-off"
title = "Key on, engine off checks"
group = "live-data"
aliases = ["KOEO", "key on engine off", "key-on engine-off"]
summary = "With the key on and the engine off, several sensors should agree with each other, which finds faults before the engine runs."
body = [
  "With the ignition on and the engine stopped, the computer and sensors have power but nothing is changing. It is a simple test of the sensors.",
  "Each reading should match a known truth. A reading that does not match points to that sensor or its wiring.",
]
how_to_read = [
  "Manifold pressure (MAP) should match barometric pressure, because the manifold is at air pressure when the engine is off. Sea level is about 29.9 inHg (about 101 kPa). It falls about 1 inHg for each 1000 ft of height (about 3.4 kPa for every 300 m). Compare with the barometric (BARO) value if the car reports one.",
  "A MAP value far from BARO points to the sensor, its wiring or its reference or ground. Do not condemn the sensor from this test alone. Cycle the key a few times: the readings should repeat.",
  "Coolant and intake air temperature on a cold engine should match within a degree or two. If not, see pattern-ect-sensor.",
  "Battery voltage at rest: a fully charged battery reads about 12.6 V.",
  "Diesel rail pressure and DPF differential pressure should read near zero.",
  "Air flow, engine speed and engine load should read near zero. A readable throttle and pedal should move smoothly when you press them slowly, with no jumps.",
]
faults = [
  "Look-alike: a warm engine or sun on the intake makes the temperatures differ. Wait for a cold soak.",
  "Look-alike: a flat battery can give odd sensor readings.",
]
related = ["map-reading", "coolant-temp-reading", "intake-air-temp", "throttle-pedal", "voltage-reading", "test-conditions", "pattern-ect-sensor"]
sources = [
  "MOTOR Information Systems, 'Driveability Corner | Idle MAP' (read 2026-10-16)",
  "The Car Buzz, 'MAP Sensor Testing Guide: How to Test a MAP Sensor' (read 2026-10-16)",
  "AA1Car.com, 'How to Check & Replace an Engine Coolant Sensor' (read 2026-10-16)",
  "Jiffy Lube, 'What Is Car Battery Voltage?' (read 2026-10-16)",
]

[[topic]]
id = "test-conditions"
title = "Test conditions"
group = "live-data"
aliases = ["test conditions", "idle test", "2500 rpm test", "steady cruise", "warm engine test", "cold engine test"]
summary = "Each check names its conditions because the same value means different things at idle, at 2500 rpm, under load, cold or warm."
body = [
  "A fuel trim of +12 % means one thing at idle and another at 2500 rpm. A coolant reading of 60 degrees C is fine in the first minutes and wrong after twenty. The condition is part of the reading.",
  "Scana's tests state their conditions so you compare like with like. Keep them the same before and after a repair.",
]
how_to_read = [
  "Key on, engine off, engine cold: sensor agreement. See key-on-engine-off.",
  "Warm idle in closed loop: the baseline for trims. Check that the coolant reading matches the real engine temperature first.",
  "2000 to 2500 rpm, no load: the second point. A vacuum leak shrinks here, while a dirty MAF sensor or weak fuel supply does not.",
  "Under load, on the road or with the air conditioner on: the third point. Weak fuel supply shows here. Trims past about 10 % deserve a full diagnosis, and about 5 % or less is normal.",
  "Warm versus cold: a cold engine runs richer. Do not judge trims or oxygen sensor switching until the engine is warm and in closed loop.",
  "Steady cruise and full-throttle runs show converter behaviour, boost and fuel supply. Full throttle usually puts the engine in open loop, where trims do not apply (general knowledge, unverified).",
]
faults = [
  "Comparing a hot summer drive with a cold winter drive can mislead.",
  "A short trip may never reach closed loop.",
]
related = ["closed-loop", "fuel-trim", "rpm-idle", "key-on-engine-off", "pattern-vacuum-leak", "pattern-maf-fault", "using-graphs"]
sources = [
  "APEX Tech Nation, 'Fuel Trim Diagnostics Explained' (read 2026-10-16)",
  "MOTOR Information Systems, 'Lean On Me' (read 2026-10-16)",
  "AVI OnDemand, 'Fuel Trim Diagnosis And O2 Sensor Performance' (read 2026-10-16)",
  "Carista, 'P0128 Code Explained: Causes and Fixes' (read 2026-10-16)",
]

[[term]]
name = "Unmetered air"
text = "Air that enters the engine without passing the air flow sensor, so the engine computer does not add fuel for it."

[[term]]
name = "Smoke test"
text = "A leak test that pushes harmless smoke into the intake or exhaust so the escaping smoke shows the leak."

[[term]]
name = "Underboost"
text = "A turbo engine that makes less boost pressure than the engine computer asks for."

[[term]]
name = "Bi-fuel"
text = "A car that can run on petrol and a second fuel such as LPG, and switches between them."

[[term]]
name = "E10"
text = "Petrol with up to 10 percent ethanol."

[[term]]
name = "Rail pressure"
text = "The fuel pressure in a common rail diesel's shared fuel line, measured in bar."

[[term]]
name = "Soot load"
text = "The amount of soot the diesel particulate filter has collected, shown in grams or percent."

[[term]]
name = "Differential pressure"
text = "The pressure difference between the two sides of a part, such as a diesel particulate filter. A high value means a blockage."

[[term]]
name = "State of charge"
text = "How full a battery is, shown as a percentage."

[[term]]
name = "Cold soak"
text = "An engine that has stood long enough to reach air temperature, so all its temperature sensors should agree."

[[term]]
name = "Snap throttle"
text = "Opening and closing the throttle quickly to check how fast a sensor responds."
