[[topic]]
id = "voltage-reading"
title = "Reading control module voltage"
group = "live-data"
aliases = ["control module voltage", "battery voltage", "system voltage", "charging voltage"]
summary = "Control module voltage is the supply the engine computer sees: about 12.4 to 12.7 V engine off, about 13.5 to 14.7 V running."
body = [
  "PID 42 is the supply voltage at the engine computer. It is a quick way to check the battery and charging system with no extra tools. It reads a little less than the true battery voltage because of wiring losses.",
  "With the engine off, a fully charged battery reads about 12.6 V (12.4 to 12.7 V counts as healthy). With the engine running, a conventional alternator holds about 13.5 to 14.7 V.",
  "Many modern cars use smart charging. The charge voltage then moves on purpose to save fuel, so it may sit at 12.5 V one moment and 14.5 V the next.",
]
how_to_read = [
  "Cranking: a dip to about 9.6 to 10.5 V is normal on a good 12 V battery. Below about 9.6 V points to a weak battery or poor connections.",
  "Running under about 13 V steadily on a car without smart charging confirms undercharging. Above about 15 V points to a regulator fault, which can damage the battery and modules.",
  "Raise the load (lights, fan, rear window heater) at about 2000 rpm: the voltage should hold. A big sag means a weak alternator or a poor charging circuit.",
  "On smart charging cars, judge over several minutes, not one reading. One source saw about 12.8 V at steady cruise with a full battery and about 14.8 V on deceleration.",
  "The module sees slightly less than the battery terminals, because of wiring losses.",
]
related = ["charging-system", "pattern-charging", "battery", "starting-system", "pid:42", "guide:charging", "guide:flat-battery"]
sources = [
  "Wikipedia, 'Car battery' (read 2026-10-16)",
  "Apex Tech Nation, 'Charging System Diagnosis: Alternator, Battery, and Voltage Drop' (read 2026-10-16)",
  "Voltage Basics, 'Battery Voltage While Cranking: What is a Normal Voltage Drop?' (read 2026-10-16)",
  "Wikipedia, 'OBD-II PIDs', PID 42 (read 2026-10-16)",
]

[[topic]]
id = "rpm-idle"
title = "Engine speed and idle"
group = "live-data"
aliases = ["engine speed", "idle speed", "idle rpm", "fast idle", "hunting idle", "revs"]
summary = "A warm petrol engine idles at a steady speed, typically about 600 to 900 rpm, and holds it as loads come on."
body = [
  "Engine speed is shown in revolutions per minute (rpm, PID 0C). At idle, the engine computer holds the speed steady by moving the throttle or an idle air valve and adjusting timing.",
  "A cold engine runs a higher fast idle, about 1000 to 1500 rpm, which settles to the normal warm idle as the engine warms. A warm petrol idle is typically 600 to 900 rpm, and a little lower in gear.",
  "Loads such as A/C, headlights, the rear window heater and power steering try to slow the engine. The computer adds a little air and fuel so the speed stays near target. One guide gives about 50 to 150 rpm more with A/C on, and 50 to 100 rpm more with power steering at low speed.",
]
how_to_read = [
  "Warm idle should hold steady. Small, short changes when accessories switch on or off are normal.",
  "Hunting idle: the speed rises and falls on its own in a slow pattern. Common causes are a vacuum leak, a dirty throttle body or idle valve, or a bad sensor.",
  "A low idle that dips when A/C starts and stalls means the idle control cannot add enough air.",
  "Stays high after warm-up (above about 1000 rpm): check for a vacuum leak, a sticking throttle, or a coolant sensor reading cold.",
  "A rough idle with a steady average rpm and misfire counts in test results points to a misfire.",
]
related = ["pattern-misfire", "pattern-vacuum-leak", "guide:idle", "pid:0C", "term:Idle air control valve", "term:Fast idle", "term:Hunting idle"]
sources = [
  "Harrison Jack, 'Idle Speed: The Essential Guide to Understanding and Optimising Your Engine's Idle' (read 2026-10-16)",
  "CarXplorer, 'What Should My Car Idle At? Normal RPM Range Explained' (read 2026-10-16)",
  "Skanyx, 'OBD2 Live Data: Parameters, Normal Ranges, Reading Guide' (read 2026-10-16)",
  "Wikipedia, 'OBD-II PIDs', PID 0C (read 2026-10-16)",
