]

[[topic]]
id = "readiness-monitors"
title = "Readiness monitors"
group = "live-data"
aliases = ["readiness", "readiness status", "monitor status", "not ready", "monitors complete", "inspection ready", "continuous monitors", "non-continuous monitors", "drive cycles", "drive cycle"]
summary = "Readiness monitors show which of the car's self-tests have finished since codes were last cleared."
body = [
  "The car runs self-tests on its emission systems. A monitor is complete when its test has run and finished since the last reset. It is not complete (not ready) when it has not run yet.",
  "Three monitors run continuously whenever the engine runs: misfire, fuel system, and comprehensive components (sensors and actuators). The others run only when certain conditions are met: catalyst, heated catalyst, EVAP, oxygen sensor, oxygen sensor heater, EGR, and secondary air.",
  "Clearing codes or disconnecting the battery resets the monitors to not complete, and so can some performance tunes. The car then needs drive cycles, with the right mix of cold start, steady cruise, and idle, to run them again.",
]
how_to_read = [
  "Complete means the test ran and finished. Not complete is not a fault; it means no result yet.",
  "Each maker sets its own drive cycle. Examples from one guide: a Toyota catalyst test needed about 7 minutes at 40 to 55 mph (about 65 to 90 km/h) then 7 minutes at 35 to 45 mph (about 55 to 70 km/h); a Ford oxygen sensor test needed a warm engine and about 4 minutes at a steady 40 mph (about 65 km/h).",
  "The EVAP monitor usually needs a cold soak of 8 hours or more, a part-full tank (about one quarter to three quarters) and mild weather. Some cars also need the oxygen sensor monitor to finish before the catalyst monitor can run.",
  "Many inspections reject a car if any monitor it supports is not ready. The rules vary by place; check the local rule.",
  "Do not clear codes just before an inspection. Read the codes and freeze frame first, repair, and then let the monitors finish.",
  "Scana shows these on the Readiness screen.",
]
related = ["freeze-frame-reading", "mode06-reading", "test-conditions", "page:readiness", "term:Readiness monitor", "term:Drive cycle", "term:Monitor"]
sources = [
  "AA1Car, 'OBD Monitor Not Ready' (read 2026-10-16)",
  "Innova, 'Understanding OBD2 Monitors' (read 2026-10-16)",
  "OBDHut, 'I/M Readiness Monitors: Emission Inspection Guide' (read 2026-10-16)",
]

[[topic]]
id = "freeze-frame-reading"
title = "Reading a freeze frame"
group = "live-data"
aliases = ["freeze frame", "freeze frame data", "freeze-frame"]
summary = "A freeze frame is a snapshot of key values taken when a fault code was stored, showing the conditions it happened in."
body = [
  "When the car stores a fault code that lights the warning lamp, it also records a snapshot of important values: engine speed, load, coolant temperature, vehicle speed, fuel trim, fuel system status and more. This snapshot is the freeze frame.",
  "Most cars keep only one frame, tied to the first code that set or the highest-priority one. A later misfire or fuel system code can replace it. Clearing codes erases the frame.",
  "Read the freeze frame before clearing anything. It tells you how the engine was running at the moment of the fault.",
]
how_to_read = [
  "Check which code the frame belongs to. Scana shows the code next to the snapshot.",
  "Use the conditions to repeat the fault: cold or warm, idle or cruise, light or heavy load, speed. Drive the car under the same conditions and watch live data.",
  "Low load at idle: the fault happened at idle, so faults that only show under load are less likely. High load and speed: look at fuel delivery and ignition before vacuum leaks.",
  "High fuel trims in the frame mean the mixture was already wrong before the code set, so the code may be a symptom. If the frame shows open loop, an oxygen sensor is unlikely to be the cause.",
  "Coolant temperature in the frame tells you whether the fault happened cold (open loop) or warm.",
  "The frame is one moment, not a trend. Use live data and graphs to see how the problem develops.",
]
related = ["reading-live-data", "readiness-monitors", "test-conditions", "term:Freeze frame", "page:codes"]
sources = [
  "Steer, 'OBD2 Freeze Frame Data Explained: How to Interpret It' (read 2026-10-16)",
  "OBD Auto Doctor, 'OBD2 Freeze Frame explained' (read 2026-10-16)",
]

[[topic]]
id = "mode06-reading"
title = "Reading on-board test results (mode 06)"
group = "live-data"
aliases = ["mode 06 results", "mode $06", "test results", "monitor ID", "test ID", "misfire counts", "on-board test results"]
summary = "Mode 06 shows the raw result and pass limits of each self-test, so you can spot a part nearing failure before a code sets."
body = [
  "Mode 06 lists the results of the car's own self-tests. Each test has a monitor ID (the system, such as catalyst or one cylinder's misfire), a test ID (which test), a measured value, and minimum and maximum limits. Scana shows these on the Test results screen.",
  "On CAN cars the monitor IDs are the same on every make, but the test IDs are not. Maker-specific tests often use numbers from 80 up (for example, 80 and 81 in one maker's oxygen sensor monitor), and their meaning comes from the maker.",
  "A test passes when its value is inside the limits. A value close to a limit means the part is nearly failing: a useful early warning, before a code or the warning lamp.",
]
how_to_read = [
  "Look at how close each result is to its limit, not just pass or fail. A result that passes by a hair is a part nearly failing.",
  "After a repair, check the value fell well inside its limit. In one case a catalyst value dropped after new sensors but was still over the limit, so the fault would have come back.",
  "Raw values often need the maker's scaling before you can compare them with limits. Some tools do this for you.",
  "Misfire counts: each cylinder has a count. Zero or very low is healthy; under about 100 over a period is usually fine; several hundred to a thousand or more on one cylinder points to its ignition, fuel or compression.",
  "Compare cylinders with each other. A misfire code usually sets only when the misfire rate reaches about 2 %.",
  "Check the cylinder count. Some cars report counts for cylinders the engine does not have.",
]
more_detail = [
  "On a Ford CAN example, monitor ID A1 is the misfire monitor for the whole engine and A2 to AB are per-cylinder misfire monitors. Oxygen sensor monitors are 01 to 07 and catalyst monitors 21 and 22. Older cars used test and component IDs, with no common numbering between makers.",
]
related = ["readiness-monitors", "pattern-misfire", "pattern-catalyst", "page:tests", "term:Mode 06", "term:Monitor ID"]
sources = [
  "AA1Car, 'OBD II Mode $06 Diagnostics' (read 2026-10-16)",
  "OBD Auto Doctor, 'Using OBD2 Mode $06 for advanced car diagnostics' (read 2026-10-16)",
  "MOTOR, 'Advanced Mode $06 Diagnostics' (read 2026-10-16)",
  "RLEscalambre, '$06 Non-Continuous/Continuous Monitor Test Results' (read 2026-10-16)",
]

[[topic]]
id = "update-rates"
title = "How often values update"
group = "live-data"
aliases = ["update rate", "sample rate", "refresh rate", "polling rate", "gap in the graph"]
summary = "Scana asks the car for each value in turn, so more values selected means each one updates less often."
body = [
  "Scana asks the car for values by sending a request and waiting for the reply. The engine computer answers one request at a time on the diagnostic bus, so the more values you watch, the less often each one updates.",
  "When Scana is alone on the bus, it asks for up to 6 values in one request, and waits at least 50 ms between requests. If another tester, such as a dash display, is polling too, it asks for only as many values as fit a one-frame reply (2 or 3) and waits at least 100 ms. That is because the engine computer can cut off a longer reply.",
  "Scana also sorts values by how fast they change. Fast ones (engine speed, vehicle speed, load, fuel trims, oxygen sensors, throttle) are asked for every 200 ms, most temperatures and pressures every 1 s, and slow ones (distance since codes were cleared, run time, fuel type) every 5 s.",
]
how_to_read = [
  "Live data shows each value's real update rate in Hz. Use that number, not the value's target rate, to judge how much detail you see.",
  "Fast values show about 5 updates a second at best. A fast swing, such as an oxygen sensor crossing 0.45 V several times a second, can be smoothed or missed.",
  "Fewer values selected gives faster updates. Another tester on the bus slows every value.",
  "A flat step in a graph means the value did not change between updates, or the reply was late. A gap in a line means no reply came: the car was busy, the bridge dropped a message, or the engine computer stopped answering.",
  "Slow values such as run time and fuel type are asked for only every 5 s, so a steady line there is normal.",
]
related = ["using-graphs", "reading-live-data", "obd-on-can", "sharing-the-bus", "bus-load", "page:live", "page:graphs"]
sources = [
  "Scana's design notes, docs/DESIGN.md (read 2026-10-16)",
  "Wikipedia, 'OBD-II PIDs', mode 01 requests (read 2026-10-16)",
]

[[term]]
name = "Cross counts"
text = "How many times a front oxygen sensor's voltage crosses 0.45 V each second. A healthy sensor gives several."

[[term]]
name = "Fuel cut"
text = "The engine computer stops fuel to the injectors when you coast down with the throttle closed, to save fuel."

[[term]]
name = "Equivalence ratio"
text = "The same idea as lambda, shown as a number: 1.00 is the ideal mixture, below 1.00 is rich, above 1.00 is lean."

[[term]]
name = "Heat soak"
text = "Heat from a hot engine warming the air and parts around it, so intake air temperature climbs when the car is stopped."

[[term]]
name = "Fast idle"
text = "A raised idle speed on a cold engine, used to warm the engine and keep it running smoothly."

[[term]]
name = "Hunting idle"
text = "Idle speed that rises and falls on its own in a slow cycle instead of holding steady."

[[term]]
name = "Knock retard"
text = "The engine computer delays the spark when it hears knock, to protect the engine. It costs some power."

[[term]]
name = "Monitor ID"
text = "A number that names one self-test system in mode 06 results, such as the catalyst or one cylinder's misfire count."

[[term]]
name = "Pump current"
text = "The small current in mA a wide-band sensor needs to keep its cell steady. It shows how lean or rich the exhaust is."

[[term]]
name = "Key-on engine-off"
text = "Ignition on with the engine not running. Many sensors should read the outside world in this state."

[[term]]
name = "Commanded value"
text = "The target the engine computer asks for, such as a throttle position or air-fuel ratio, as opposed to the measured value."
