[[topic]]
id = "throttle-pedal"
title = "Reading throttle and pedal positions"
group = "live-data"
aliases = ["throttle position", "pedal position", "accelerator pedal position", "relative throttle", "absolute throttle", "commanded throttle", "TPS reading"]
summary = "Throttle and pedal readings come in pairs from two sensors each; the pairs should agree and follow your foot smoothly."
body = [
  "A drive-by-wire car has a pedal and a throttle body, each with two position sensors. The two sensors on one part read different numbers on purpose, so the engine computer can spot a fault. Scana shows them as PIDs 11, 45, and 47 to 4C.",
  "The computer reads the pedal, decides how open the throttle should be (commanded throttle), and drives the motor. The throttle sensors then report where it actually is.",
  "Relative throttle (PID 45) is shown from the learned closed position, so it reads 0 % when closed. Absolute throttle (PID 11, 47) is the raw sensor reading on its own scale, so it reads above 0 % when closed.",
]
how_to_read = [
  "Absolute throttle and pedal readings (PIDs 11, 47, 49, 4A) are a percent of the sensor's 5 V supply, not of the throttle's travel. A sensor never sends 0 V or 5 V, so these readings never run from 0 to 100 %.",
  "Closed throttle: usually about 10 to 20 %. Toyota gives 10 to 22 % for its first throttle sensor. The engine computer sets the idle speed with the throttle, so the idle reading is a little higher on a cold engine.",
  "Wide open: usually well under 100 %. Toyota gives 64 to 96 % on one engine and 66 to 98 % on another; a scan app maker says 80 to 90 % is common. Some guides call less than 90 % a fault: that rule is for a learned reading on some scan tools, not for these values.",
  "Relative throttle (PID 45) starts from the learned closed position, so it reads about 0 % at idle. Fully open it can still read well under 100 %: Toyota's own learned opening reads 50 to 80 % fully open.",
  "Your own car is the best guide. Note its closed and wide-open readings while it runs well (Scana's recordings keep them), and look for a change.",
  "The pedal has two sensors that agree in a fixed way. Released, Toyota's first pedal sensor reads 10 to 22 % and its second 24 to 40 %; on other designs one reads about half the other. Makers differ, so watch that a pair moves together, not that the numbers match.",
  "Commanded throttle and actual throttle should track each other within a few percent. A gap means a sticking or dirty throttle body or a motor fault.",
  "Move the pedal slowly through its range: readings should rise smoothly with no jumps or dropouts. A jump is a worn track.",
  "If the two sensors of a pair stop agreeing, the computer sets a code and usually goes into limp mode.",
]
related = ["electronic-throttle", "position-sensors", "pid:11", "pid:45", "pid:47", "pid:4C", "term:TPS", "term:Accelerator pedal sensor", "term:Throttle body"]
sources = [
