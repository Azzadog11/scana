[[topic]]
id = "vehicle-speed"
title = "Vehicle speed"
group = "live-data"
aliases = ["vehicle speed sensor", "road speed", "speed reading", "VSS"]
summary = "Vehicle speed (PID 0D) comes from wheel speed sensors or the gearbox output and is shown in whole km/h."
body = [
  "The engine computer gets vehicle speed from the ABS module over the network, which uses the wheel speed sensors. Some cars still use a sensor on the gearbox output shaft. The value is a whole number in km/h (PID 0D).",
  "The number is calculated from wheel turns and tyre size, so tyre size changes it. Smaller tyres make it read high and larger tyres make it read low. Makers often set the speedometer a little high on purpose.",
  "The speed is used for gear changes, cruise control, idle control and fuel cut. It also checks that the other sensors make sense.",
]
how_to_read = [
  "Compare the Scana value with a GPS speed on a steady, flat road at about 50 to 60 km/h. The speedometer is often set to read a little high; the OBD value is usually closer to the truth.",
  "Speed reads zero while the car moves: a wheel speed sensor, ABS module or network fault. Check ABS and gearbox codes.",
  "Speed jumps while the speedo is steady, or the reading flickers at low speed: dirty or damaged tone ring, or a sensor fault.",
  "Large tyres, or a final-drive change, shift the reading in proportion.",
]
related = ["abs-system", "guide:vss", "guide:abs-wheel-speed", "pid:0D", "term:Vehicle speed sensor", "term:Wheel speed sensor", "term:Tone ring"]
sources = [
