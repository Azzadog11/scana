[[topic]]
id = "listen-only"
title = "Listen-only mode"
group = "protocols"
aliases = ["listen only", "silent mode", "passive listening", "listening"]
summary = "In listen-only mode the bridge hears the bus but never sends, acknowledges or raises errors, so it cannot disturb the car."
body = [
  "In listen-only mode the CAN chip receives frames but stays silent. It sends nothing, does not fill the ACK slot, and sends no error frames. To the car, the bridge is not there.",
  "A tool listens first because it does not yet know the bus. If it sent at the wrong bit rate, it would cause errors for every module. Listening is safe at any rate: a wrong rate just gives no good frames.",
  "Scana listens before it sends. It checks that the bus is alive and at the right rate, then it switches to normal mode only when it must ask a question.",
]
more_detail = [
  "The MCP2515 has a listen-only mode. Because the chip does not acknowledge, a listener on a bus with no other node sees nothing at all. Listen-only is also how a logger can record safely from a bus without changing it. Nodes in error passive or bus-off states do not disturb others either, but they do not have the choice.",
]
related = ["bit-rate", "ack", "can-errors", "why-read-only", "sharing-the-bus", "term:Listen-only"]
sources = [
  "CSS Electronics 'CAN bus errors explained' (read 2026-10-16)",
  "Wikipedia 'CAN bus' (read 2026-10-16)",
]

[[topic]]
id = "can-fd"
title = "CAN FD"
group = "protocols"
aliases = ["CAN FD", "CAN-FD", "flexible data rate", "classic CAN"]
summary = "CAN FD carries up to 64 data bytes and speeds up its data phase. Classic CAN chips like the MCP2515 cannot join such a bus."
body = [
  "CAN FD (Flexible Data-rate) is a newer version of CAN. A frame can carry up to 64 data bytes, not 8. After the ID it can switch to a faster bit rate for the data, commonly 2 to 5 Mbit/s, then slow back down for the end of the frame.",
  "Carmakers use it where there is more data, such as driver assistance, and some newer cars have it on internal buses. Diagnostics on the OBD-II socket still use classic CAN in most cars today.",
  "A classic CAN chip like Scana's MCP2515 does not understand the CAN FD frame. It sees a long frame with a speed change and reads it as an error. On a mixed bus, it can even upset the FD nodes, so keep the bridge off a CAN FD bus.",
]
how_to_read = [
  "If Scana shows only errors on a modern car at a standard rate, the diagnostic bus may use CAN FD. Classic OBD-II requests usually still work through the OBD-II socket.",
]
more_detail = [
  "CAN FD data lengths go 0 to 8, then 12, 16, 20, 24, 32, 48 and 64 bytes. It stays compatible with classic CAN at the frame start, so an FD-capable chip can handle both kinds. Payload rates of 5 to 8 Mbit/s are possible with better transceivers, but real speeds depend on the length of the wiring.",
]
related = ["can-frame", "controller-transceiver", "bit-rate", "can-errors", "obd-on-can", "can-fd"]
sources = [
  "Wikipedia 'CAN FD' (read 2026-10-16)",
  "CSS Electronics 'CAN FD explained' (read 2026-10-16)",
]

[[topic]]
id = "obd-connector"
title = "The OBD-II connector"
group = "protocols"
aliases = ["OBD-II connector", "OBD connector", "OBD port", "OBD socket", "diagnostic socket", "DLC connector", "data link connector", "16-pin connector"]
summary = "The OBD-II socket has 16 pins. Pins 4 and 5 are grounds, 16 is battery, and 6 and 14 are CAN-H and CAN-L."
body = [
  "The OBD-II socket is a standard 16 pin connector, usually under the dash on the driver's side, often near the steering column or hidden behind a small panel. Every OBD-II car uses the same shape.",
  "Fixed pins: 4 is chassis ground, 5 is signal ground and 16 is battery positive (12 V, often live with the key off). The bus pins depend on the car's protocol: 6 is CAN-H and 14 is CAN-L, 7 is the K-line and 15 the L-line, 2 is J1850 bus+ and 10 is J1850 bus-.",
  "Other pins (1, 3, 8, 9, 11, 12, 13) are free for the maker's own use, sometimes for other CAN buses. A cheap adapter may wire only the pins it needs.",
  "Scana's cable uses pins 6 and 14 (CAN), 4 and 5 (grounds) and 16 (battery). The shield takes the car's 12 V through a fuse and a diode, as well as power from the laptop's USB.",
]
how_to_read = [
  "No pins 6 and 14 fitted in the socket: the car probably uses another protocol (K-line or J1850), not CAN.",
  "Check pin 16 and ground with a multimeter first. About 12 V between pins 16 and 4 means the socket is alive.",
]
related = ["can-physical", "termination", "obd-protocols", "k-line", "other-networks", "obd2-overview", "term:OBD-II"]
sources = [
  "Wikipedia 'On-board diagnostics' (read 2026-10-16)",
  "CSS Electronics 'OBD2 explained: a simple intro' (read 2026-10-16)",
]

[[topic]]
id = "other-networks"
title = "Other in-car networks"
group = "protocols"
aliases = ["LIN bus", "LIN", "FlexRay", "MOST", "automotive Ethernet", "in-car networks"]
summary = "Besides CAN, cars use LIN for simple parts, FlexRay and Ethernet for fast or critical data, MOST for media, and J1850 on older cars."
body = [
  "LIN (Local Interconnect Network) is a cheap single-wire bus. It links simple parts to one master, such as window switches, mirror motors and rain sensors. It is slow, about 20 kbit/s.",
  "FlexRay is faster (up to 10 Mbit/s) and keeps strict time slots, so messages arrive on schedule. A few makers use it for chassis and safety systems. It is being replaced by Ethernet.",
  "MOST carried audio and video over optical fibre in some cars. Automotive Ethernet is now the choice for cameras, displays, and software updates, at 100 Mbit/s and up.",
  "J1850 (PWM and VPW) was the diagnostic link on older US cars before CAN. Older K-line cars use a one-wire serial line.",
  "Scana reads CAN only. Other networks can sit behind a gateway module that joins them to CAN.",
]
related = ["car-networks", "can-bus", "k-line", "obd-protocols", "gateways-addressing", "term:J1850", "term:K-line"]
sources = [
  "Wikipedia 'Local Interconnect Network' (read 2026-10-16)",
  "Wikipedia 'FlexRay' (read 2026-10-16)",
  "Wikipedia 'On-board diagnostics' (read 2026-10-16)",
]

[[topic]]
id = "slcan-socketcan"
title = "How PC tools talk to CAN adapters"
group = "protocols"
aliases = ["SLCAN", "SocketCAN", "candump", "can-utils", "Lawicel", "serial line CAN", "slcand"]
summary = "SLCAN is a simple text protocol over a serial port; SocketCAN is how Linux treats CAN adapters as network interfaces, with can-utils tools."
body = [
  "A laptop does not speak CAN directly. An adapter does that and talks to the laptop in another language. SLCAN (serial line CAN) is a simple text one. Scana's Arduino bridge speaks it over USB.",
  "Commands are short letters ending with a carriage return. S6 sets 500 kbit/s (S5 is 250 kbit/s), O opens the channel and C closes it. A received standard frame is written t, then the ID, the length and the data in hex, for example t7E8804410C1AF8000000 for ID 7E8.",
  "SocketCAN is the Linux way: a CAN adapter appears as an interface such as can0, like a network card. The can-utils programs work with it: candump shows frames, cansend sends one, and canplayer replays a log. Scana does not need these but you can use them on the same bus to compare.",
]
more_detail = [
  "In SLCAN, lower case t means a standard 11 bit frame and upper case T an extended 29 bit frame, with the ID as 3 or 8 hex digits. Some firmware adds listen-only (L) and other commands, and not all adapters agree on every command, so check the firmware. The tool slcand can attach an SLCAN adapter to SocketCAN as a can0 interface.",
]
related = ["reading-bus-monitor", "controller-transceiver", "listen-only", "bit-rate", "bus-load", "page:monitor", "slcan-socketcan"]
sources = [
  "Wikipedia 'SocketCAN' (read 2026-10-16)",
  "linux-can/can-utils README on GitHub (read 2026-10-16)",
  "Linux kernel documentation 'SocketCAN' (read 2026-10-16)",
]

# Short words that need a one-line meaning but not a whole topic, and aren't in glossary.toml yet:
[[term]]
name = "Dominant bit"
text = "On CAN, a 0 bit, sent by driving CAN-H up and CAN-L down. It always wins over a recessive bit."

[[term]]
name = "Recessive bit"
text = "On CAN, a 1 bit, the resting state where both wires sit near 2.5 V. Any dominant bit overrides it."

[[term]]
name = "Differential signal"
text = "A signal carried as the voltage difference between two wires, so noise that hits both wires cancels out."

[[term]]
name = "Twisted pair"
text = "Two wires twisted around each other so that noise reaches both equally and cancels in a differential signal."

[[term]]
name = "Time quantum"
text = "The smallest slice of time in a CAN bit. Each bit is built from a set number of them."

[[term]]
name = "Sample point"
text = "The moment inside each bit when a CAN node reads the wire, usually about three quarters of the way through."

[[term]]
name = "Arbitration"
text = "How CAN decides who sends when two modules start together: the lower ID wins, and the other waits."

[[term]]
name = "CRC"
text = "A check number sent with a frame. The receiver works it out again to confirm the data arrived unchanged."

[[term]]
name = "DLC"
text = "Data length code: the number of data bytes in a CAN frame, 0 to 8 on classic CAN."

[[term]]
name = "Error frame"
text = "Six dominant bits that a CAN node sends to tell everyone the current frame is faulty and must be dropped."

[[term]]
name = "Standard frame"
text = "A CAN frame with an 11 bit ID. The other kind, with a 29 bit ID, is the extended frame."

[[term]]
name = "Extended frame"
text = "A CAN frame with a 29 bit ID, used for some diagnostics and in trucks."

[[term]]
name = "DBC file"
text = "A text file that lists the signals in each CAN frame: where they sit, their scale, offset and unit."

[[term]]
name = "Endianness"
text = "The byte order of a number in a frame: little endian puts the low byte first, big endian puts the high byte first."

[[term]]
name = "Transceiver"
text = "The chip that turns a CAN controller's logic levels into the voltages on the CAN wires and back."
