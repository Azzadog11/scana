[[topic]]
id = "sensor-signals"
title = "How sensors talk to the engine computer"
group = "systems"
aliases = ["sensor signals", "5 V reference", "5V reference", "sensor reference", "sensor ground", "sensor wiring", "open circuit reading", "short circuit reading"]
summary = "A sensor sends a voltage or pulses to the computer on a signal wire. The computer also supplies 5 V and a clean ground."
body = [
  "Most engine sensors have three wires: a 5 V reference from the engine computer, a signal back, and a sensor ground. Some have two, like a thermistor, which uses the reference through a resistor inside the computer.",
  "Thermistors change resistance with temperature. Potentiometers change it with position. Hall effect sensors turn a magnetic field into an on and off or analog signal, and need a supply. Reluctance (magnetic) sensors make their own AC voltage. Piezo sensors make a small voltage from shock or pressure.",
  "The computer knows what range a good signal falls in. A signal outside it is called circuit low or circuit high, and the computer sets a code for it.",
]
how_to_read = [
  "Several sensors can share one 5 V reference. If their codes appear together, check the shared reference and ground first.",
  "An open signal wire often reads at one extreme: 5 V for a pull-up, 0 V for a pull-down. A thermistor with an open circuit reads cold (-40 C).",
  "A short to ground drives the signal to 0 V. A thermistor reads very hot (about 215 C).",
  "A short to voltage drives the signal up toward the supply voltage.",
]
parts = [
  "5 V reference: a regulated supply, often shared by a few sensors.",
  "Signal wire: carries the voltage, pulse or frequency to the computer.",
  "Sensor ground: a quiet ground that returns to the computer, not to the body.",
  "Pull-up resistor: inside the computer, makes an open wire read high.",
]
faults = [
  "Open circuit: a signal stuck at one end, and a circuit code (circuit high or low, depending on the sensor).",
  "Short to ground: signal 0 V, circuit low code.",
  "Short to voltage: signal near 5 V (or more), circuit high code.",
  "High resistance (corrosion, a loose pin): a drifting reading, a range code, or a reading that jumps when you wiggle the plug.",
  "Shared reference fault: several unrelated sensor codes at the same time.",
  "On a throttle sensor, an open wire reads like a closed throttle (low-voltage code) and a short reads like a wide-open throttle (high-voltage code), per aa1car.",
]
more_detail = [
  "A sensor ground goes to the computer's sensor ground pin and not to the engine block. This keeps heavy current from the starter or alternator from adding error to a 0.5 V signal. A bad engine ground can still shift the readings.",
  "A voltage drop test finds high resistance in a ground or reference wire. A drop above about 0.1 V on a sensor ground is worth chasing (typical, not a maker figure). The 5 V reference should read close to 5 V.",
]
related = ["actuators", "engine-management", "position-sensors", "coolant-temp-sensor", "crank-sensor", "knock-sensor", "voltage-reading", "term:Reference voltage", "term:Open circuit", "term:Short circuit", "term:Circuit low", "term:Circuit high", "term:Thermistor", "term:Hall effect sensor", "term:Reluctance sensor"]
sources = [
  "aa1car.com, 'Basics of Engine Throttle Position Sensors' (read 2026-10-16)",
  "aa1car.com, 'Making Sense of Engine Sensors' (read 2026-10-16)",
  "Wikipedia, 'Thermistor' (read 2026-10-16)",
  "Wikipedia, 'Hall-effect sensor' (read 2026-10-16)",
]

[[topic]]
id = "actuators"
title = "How the engine computer drives actuators"
group = "systems"
aliases = ["actuators", "actuator circuit", "driver circuit", "low-side driver", "switching to ground", "PWM control", "actuator control"]
summary = "The computer switches actuators on and off, or drives them with pulses, and checks the circuit for faults."
body = [
  "An actuator is a part the computer moves or switches: an injector, a coil, a valve, a relay or a motor. Most have power on one wire all the time. The computer completes the circuit by switching the other wire to ground. This is a low-side driver.",
  "For fine control, the computer pulses the output very fast: PWM. The share of time on is the duty cycle. A solenoid valve at 30 percent duty opens a little. At 70 percent it opens more. Motors use the same idea, through an H-bridge to reverse.",
  "Each driver can sense its own pin. If the pin does not go low when it should, or the current is too high or low, the computer sets a circuit code. Because of this, actuator circuit codes are common and usually point to wiring, the part, or the driver.",
]
how_to_read = [
  "Some cars let Scana show a commanded value, such as commanded purge, EGR or throttle. Compare it with the actual value from the matching sensor.",
  "A duty cycle that is high and unchanging at idle (for example 90 percent for a valve) shows the computer working hard against a fault.",
  "Circuit codes are specific. 'Circuit low' usually means a short to ground. 'Circuit high' usually means an open circuit or a short to power. 'Open' means the load is missing.",
]
parts = [
  "Driver: a transistor in the computer that switches the load to ground.",
  "Load: a coil, motor or heater: the injector, valve or relay.",
  "Power feed: fused power, often through a relay switched by the computer.",
  "Feedback: the computer reads the pin voltage or the current to check the circuit.",
  "Flyback diode or clamp: absorbs the voltage spike when a coil switches off.",
]
faults = [
  "Open coil or wire: no action, and an open circuit code. Check resistance of the part and the wiring.",
  "Short to ground on a wire: the part is always on, or the driver is damaged, with a circuit low code.",
  "Mechanical fault with a good circuit: stuck valve, worn motor. The circuit code is absent but a range or performance code appears.",
  "Blown fuse or relay: several actuators fail at once.",
]
more_detail = [
  "For low-impedance injectors, the driver uses a peak-and-hold method: a high current to open, then a lower hold current. This also cuts heat in the coil.",
  "A coil makes a voltage spike when it is switched off, so drivers include a clamp to limit it. A shorted coil can overload the driver, so measure the part before replacing the computer.",
]
related = ["sensor-signals", "fuel-injectors", "ignition-system", "electronic-throttle", "vvt", "engine-management", "term:Actuator", "term:Solenoid", "term:PWM", "term:Duty cycle", "term:Relay", "term:Open circuit"]
sources = [
  "Wikipedia, 'Pulse-width modulation' (read 2026-10-16)",
  "Fluke, 'How to Measure Fuel Injector Pulse Width and Resistance with a Multimeter' (read 2026-10-16)",
  "aa1car.com, 'How Electronic Fuel Injection Works' (read 2026-10-16)",
  "aa1car.com, 'Diagnosing Returnless Fuel Injection Systems' (read 2026-10-16)",
]

[[term]]
name = "Piezoelectric sensor"
text = "A sensor with a crystal that makes a small voltage when it is squeezed or shaken, like a knock sensor."

[[term]]
name = "Tone wheel"
text = "A wheel with teeth, and often a gap, that turns with a shaft so a sensor can count the teeth and find the shaft position."

[[term]]
name = "Pulse width"
text = "How long, in milliseconds, the computer holds an injector open for one squirt of fuel."

[[term]]
name = "Potentiometer"
text = "A track of resistance with a sliding contact. Its output voltage shows how far the pedal or throttle has moved."

[[term]]
name = "Wasted spark"
text = "A system where one coil fires two plugs together. One spark lands in a cylinder on its exhaust stroke and does nothing."

[[term]]
name = "Coil-on-plug"
text = "An ignition design with one coil sitting directly on each spark plug, so no plug leads are needed."

[[term]]
name = "Sequential injection"
text = "Each injector fires in its own cylinder's intake stroke, timed by the cam and crank sensors."

[[term]]
name = "Intake manifold"
text = "The pipes that share the incoming air among the cylinders, downstream of the throttle."

[[term]]
name = "Variable vanes"
text = "Adjustable blades in a turbo's turbine housing. They change the exhaust flow so the turbo makes boost at low and high engine speed."

[[term]]
name = "Adaptation"
text = "A small correction the engine computer learns and keeps in memory, such as for wear or dirt, and may lose when the battery is disconnected."

[[term]]
name = "Dwell"
text = "The time an ignition coil is switched on to charge before it fires the spark, usually a few milliseconds."

[[term]]
name = "Speed-density"
text = "A way to estimate air mass from manifold pressure, air temperature and engine speed, without a MAF sensor."

[[term]]
name = "Pump cell"
text = "The part of a wide-band oxygen sensor that moves oxygen in or out. The current needed shows the mixture."

[[term]]
name = "Pre-ignition"
text = "Fuel that ignites before the spark, from a hot spot or deposit. It is more damaging than normal knock."

[[term]]
name = "Diverter valve"
text = "A valve on a turbo engine that vents or recirculates boost air when the throttle closes, to protect the compressor."
