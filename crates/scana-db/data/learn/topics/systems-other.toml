[[topic]]
id = "car-networks"
title = "How the car's computers talk"
group = "systems"
aliases = ["car networks", "vehicle networks", "CAN buses", "powertrain CAN", "body CAN", "gateway module"]
summary = "A modern car has several networks linking its modules. The OBD port may only reach some of them."
body = [
  "A car has dozens of computers (modules). They share data on networks, so the engine, gearbox and ABS agree on speed without separate wires. The main type is CAN: two wires, many modules.",
  "The car can have several CAN buses. A fast one (often 500 kbit/s) links engine, gearbox and ABS, and a slower one links body parts. Small devices such as window motors and rain sensors use LIN, a cheap single-wire line up to 20 kbit/s with one master module.",
  "Cars may also use FlexRay, MOST or Ethernet for faster jobs. A gateway module can join buses and pass only selected messages across.",
]
how_to_read = [
  "OBD-II requires access to powertrain data. On a car with a gateway, the OBD port may connect to only some buses, or the gateway may filter requests. The first bus you find may not carry the data you want.",
  "The Modules screen lists the modules that answer. If one is missing, it may sit behind the gateway, or be asleep.",
  "The Bus monitor shows raw frames on the bus Scana is plugged into. See the protocol topics for how to read them.",
]
parts = [
  "CAN bus: two twisted wires, CAN high and CAN low, with a 120 ohm resistor at each end.",
  "LIN bus: single wire for small devices, run by a master module.",
  "Gateway: joins buses and filters traffic.",
  "OBD connector: pin 6 is CAN high and pin 14 is CAN low.",
  "Modules: engine, gearbox, ABS, airbag, body and others.",
]
faults = [
  "Several modules vanish at once with U codes: a bus wire fault, a module pulling the bus down or a low battery.",
  "A module that never sleeps: a flat battery overnight.",
  "A bus short: dash lamps all on, the car may not start.",
  "After fitting an accessory: a bad splice into CAN wires can disturb the whole bus.",
]
more_detail = [
  "Some makers fit a secure gateway on newer cars. It may block some requests until the tool proves who it is. Read-only monitoring on the powertrain bus is usually still possible, but this varies by make (unverified).",
]
related = ["can-bus", "can-physical", "termination", "gateways-addressing", "obd-connector", "other-networks", "obd-on-can", "body-control", "abs-system", "page:modules", "page:monitor", "term:Gateway", "term:Module", "term:LIN bus"]
sources = [
  "Wikipedia, 'Local Interconnect Network' (read 2026-10-16)",
  "Wikipedia, 'Vehicle bus' (read 2026-10-16)",
  "Wikipedia, 'On-board diagnostics' (read 2026-10-16)",
  "CSS Electronics, 'CAN Bus Explained - A Simple Intro' (read 2026-10-16)",
]

# Terms not yet in glossary.toml.
[[term]]
name = "Blow-by"
text = "Burnt gas that leaks past the piston rings into the crankcase. The PCV system removes it."

[[term]]
name = "Soot"
text = "Fine black carbon particles from diesel combustion. The particulate filter traps them."

[[term]]
name = "Urea"
text = "A chemical dissolved in AdBlue. Heat turns it into ammonia, which reacts with NOx in the SCR catalyst."

[[term]]
name = "Differential pressure sensor"
text = "A sensor that compares pressure before and after a part, such as a particulate filter, to show how blocked it is."

[[term]]
name = "Smart charging"
text = "A charging plan where the computer sets the alternator voltage from battery data, and may lower it while cruising to save fuel."

[[term]]
name = "Cold cranking amps"
text = "A rating of how much current a battery can give for a cold start. More means better cold starts."

[[term]]
name = "AGM"
text = "Absorbed glass mat: a sealed lead-acid battery with the acid held in glass mats. Common in stop-start cars."

[[term]]
name = "Stop-start"
text = "A system that stops the engine at rest and restarts it when you move off, to save fuel."

[[term]]
name = "Resting voltage"
text = "Battery voltage after the battery has sat unused for an hour or more. It gives a rough charge level."

[[term]]
name = "Yaw rate"
text = "How fast the car turns about an upright axis. Stability control uses it to detect a skid."

[[term]]
name = "Inverter"
text = "Electronics that change direct current from a battery into alternating current for a motor, and back."

[[term]]
name = "Regenerative braking"
text = "Braking where an electric motor acts as a generator and sends energy back to the battery."

[[term]]
name = "LIN bus"
text = "A slow, cheap single-wire network for small devices such as window motors and sensors, run by one master module."

[[term]]
name = "Transfer case"
text = "A gearbox behind the main gearbox on a 4WD vehicle. It splits drive between front and rear and may give low range."

[[term]]
name = "Oil separator"
text = "A part in the crankcase ventilation path that removes oil mist from the gas before it reaches the intake."
