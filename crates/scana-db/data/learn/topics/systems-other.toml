# Scana Library: Systems, everything beyond engine management. Researched for Scana (2026-10-16). Sources per topic.

[[topic]]
id = "catalytic-converter"
title = "Catalytic converter"
group = "systems"
aliases = ["catalytic converter", "catalyst", "three-way catalyst", "cat"]
summary = "A metal canister in the exhaust that turns three harmful gases into water, carbon dioxide and nitrogen."
body = [
  "A petrol engine's exhaust holds carbon monoxide (CO), unburnt fuel (HC) and nitrogen oxides (NOx). The three-way converter cleans all three at once. Inside is a ceramic or metal honeycomb coated with platinum, palladium and rhodium.",
  "It only works well when the mixture stays close to 14.7:1, so the engine computer swings it slightly rich and lean. The coating contains ceria, which holds spare oxygen when the mixture is lean and gives it back when rich. This is called oxygen storage.",
  "The converter must be hot. It starts to work at about 250 to 300 degrees C (light-off) and works well from about 400 degrees C (typical). The engine computer judges its health by comparing the oxygen sensors before and after it.",
]
how_to_read = [
  "On Live data, the oxygen sensor after the converter (sensor 2) should stay fairly steady. If it swings like the front sensor, the converter has lost its oxygen storage.",
  "Code P0420 (bank 1) means efficiency is below the limit. Engines with two banks also have a matching code for bank 2. Check for exhaust leaks, misfires and a faulty rear sensor before you blame the converter.",
  "The Readiness screen shows the catalyst monitor. It needs a warm engine and steady driving to complete.",
]
parts = [
  "Substrate: a honeycomb of ceramic or metal that gives a large surface in a small space.",
  "Washcoat: a rough coating with ceria that stores oxygen and holds the metals.",
  "Precious metals: platinum and palladium burn CO and HC; rhodium breaks up NOx.",
  "Oxygen sensors: one before and one after the converter, used to check its work.",
]
faults = [
  "Misfires: unburnt fuel burns inside the converter and overheats it. A flashing check engine lamp means stop and fix it soon.",
  "Oil or coolant burnt in the engine, for example from a leaking head gasket: deposits from silicon, phosphorus and zinc coat the honeycomb and stop it working (poisoning).",
  "A blocked converter: weak power at high revs, a hot floor, or a rotten egg smell.",
  "A rattle from underneath can mean the honeycomb has broken up.",
]
more_detail = [
  "Too much heat ages the converter fast. One reference says a converter's own temperature sensor warns above about 750 degrees C, and that modern designs survive about 900 degrees C. This is why long misfires kill converters.",
  "Some cars have a close-coupled converter near the engine for fast light-off, plus a second one under the floor. Temperatures vary by design; the workshop manual decides.",
]
related = ["pattern-catalyst", "o2-sensor", "o2-sensor-reading", "pattern-misfire", "pattern-exhaust-leak", "secondary-air", "term:Catalytic converter", "term:Oxygen storage", "term:Light-off", "guide:catalyst", "code:P0420", "page:readiness"]
sources = [
  "Wikipedia, 'Catalytic converter' (read 2026-10-16)",
  "PubMed Central, 'Catalyst State Diagnosis of Three-Way Catalytic Converters Using Different Resonance Parameters: A Microwave Cavity Perturbation Study' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "evap-system"
title = "EVAP system"
group = "systems"
aliases = ["EVAP system", "evaporative emission system", "evaporative emissions", "fuel cap", "loose fuel cap"]
summary = "A sealed system that traps fuel vapour from the tank in a charcoal canister, then burns it in the engine."
body = [
  "Petrol evaporates, especially when warm. The EVAP system stops that vapour from escaping to the air. It leads vapour from the tank to a charcoal canister, which soaks it up like a sponge.",
  "Later, with the engine warm and running, the engine computer opens the purge valve. Engine vacuum then pulls fresh air through the canister and the vapour goes into the intake to be burnt. The vent valve is normally open to let air in; it closes for leak tests.",
  "The computer tests the system for leaks. It closes the vent valve and watches the tank pressure. A leak as small as about 0.5 mm (0.020 inch) can set a code on many cars.",
]
how_to_read = [
  "Codes P0440 to P0457 cover the system. P0455 is a large leak, P0456 a very small leak, and P0457 a loose or missing fuel cap.",
  "On Live data, check purge duty and fuel tank pressure if the car reports them.",
  "The Readiness screen shows the EVAP monitor. It often needs a cold start and a part-full tank.",
]
parts = [
  "Fuel cap: seals the filler. A worn seal is the most common cause of a leak code.",
  "Charcoal canister: stores fuel vapour until the engine can burn it.",
  "Purge valve: a solenoid that lets vapour into the intake.",
  "Vent valve: a solenoid that opens the canister to fresh air, normally open.",
  "Tank pressure sensor: tells the computer the pressure or vacuum in the tank.",
  "Hoses and pipes: join the parts. They crack with age.",
]
faults = [
  "Loose, wrong or worn fuel cap: a check engine lamp soon after refuelling, often a small or large leak code.",
  "A purge valve stuck open: a leak code, and rough idle or hard starting just after refuelling because vapour floods the intake.",
  "A vent valve that does not close fully: vacuum bleeds away during the test, so the computer reads a leak.",
  "A pinhole in a vapour line or a worn valve seat: a small leak code that returns after the cap is replaced.",
]
more_detail = [
  "A workshop finds leaks by feeding low-pressure smoke into the system with the vent valve closed. A very small leak shows as a thin wisp, so UV dye helps.",
  "Leak detection varies. Some cars use engine vacuum and some use a small pump. The workshop manual decides.",
]
related = ["pattern-evap-purge", "fuel-system", "fuel-trim", "pattern-vacuum-leak", "term:EVAP", "term:Charcoal canister", "term:Purge valve", "term:Vent valve", "guide:evap-leak", "guide:evap-purge", "code:P0455", "code:P0457", "page:readiness"]
sources = [
  "Apex Tech Nation, 'EVAP System Diagnosis - P0440, P0442, P0456 and Smoke Testing' (read 2026-10-16, via search summary)",
  "Identifix, 'P0456 Code: EVAP Leak Causes & Fixes' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "egr-system"
title = "EGR system"
group = "systems"
aliases = ["EGR system", "EGR valve", "exhaust gas recirculation", "EGR cooler"]
summary = "Sends a measured amount of exhaust back into the intake to cool combustion and cut nitrogen oxide (NOx)."
body = [
  "NOx forms when combustion gets very hot. Exhaust gas holds little oxygen and does not burn. Mixed back into the intake, it dilutes the fresh air and cools the burn, so less NOx forms.",
  "A valve controlled by the engine computer meters the flow. It is shut at idle and at full load on petrol engines, and opens at part load. Petrol engines recirculate about 5 to 15 percent of the exhaust; diesels can take much more at light load.",
  "On petrol engines EGR also cuts pumping losses at part load, which helps economy. On diesels it is used a lot, so the intake gets sooty and oily. Most modern diesels cool the gas first in a small heat exchanger.",
]
how_to_read = [
  "Live data may show commanded EGR (PID 2C) and EGR error (PID 2D). A large error means the valve is not moving the amount asked for.",
  "P0401 means EGR flow is too low, often a blocked passage or a valve stuck closed. It is the more common fault because carbon only builds up.",
  "A valve that sticks open can show as a rough idle, stalling and poor throttle response.",
]
parts = [
  "EGR valve: a vacuum or electric valve that opens a passage from exhaust to intake.",
  "EGR passages: pipes or drilled ports in the head and manifold that clog with carbon.",
  "EGR cooler (most diesels): a small heat exchanger using engine coolant.",
  "Position or flow sensor: tells the computer how far the valve is open or how much flows.",
]
faults = [
  "Carbon on the valve seat or in the passages: flow is too low. Signs are pinging under load and a low-flow code.",
  "A valve stuck open: rough idle, stalling and sluggish response.",
  "A leaking EGR cooler on a diesel: coolant loss with no outside leak, and white smoke with a sweet smell.",
  "Short-trip diesels: soot and oil coat the valve and passages sooner. A cleaning often helps before replacing parts.",
]
more_detail = [
  "Cooled EGR parts suffer repeated sharp temperature swings, which is why coolers can crack and leak coolant. Some designs bypass the cooler when the engine is cold, so it warms faster.",
]
related = ["diesel-live-data", "dpf", "air-intake", "pcv-system", "actuators", "term:EGR", "term:NOx", "guide:egr", "code:P0401"]
sources = [
  "Wikipedia, 'Exhaust gas recirculation' (read 2026-10-16)",
  "Apex Tech Nation, 'EGR System Diagnosis - Stuck Open, Stuck Closed, and Carbon Buildup' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "pcv-system"
title = "PCV (crankcase ventilation)"
group = "systems"
aliases = ["PCV system", "crankcase ventilation", "blow-by", "oil separator"]
summary = "Draws gas that leaks past the pistons out of the engine and burns it, so pressure never builds."
body = [
  "Some burnt gas always leaks past the piston rings into the crankcase. This is blow-by. If it stayed there, it would form sludge with the oil, and pressure would push oil out of seals and gaskets.",
  "The PCV system pulls those gases from the crankcase into the intake, so the engine burns them. Fresh air enters through a breather hose. A PCV valve controls the flow: it closes down at idle, when vacuum is high, and opens more under load. It also blocks boost pressure or backfires from entering the crankcase.",
  "Many engines also have an oil separator that drops oil droplets out of the gas first.",
]
how_to_read = [
  "A leak in this system acts like a vacuum leak. Look for high positive fuel trims at idle that fall at higher revs, and a high idle speed.",
  "A stuck-open valve or cracked hose often shows up as lean codes such as P0171 or P0174 rather than a PCV code.",
]
parts = [
  "PCV valve: a spring valve or diaphragm that meters crankcase flow.",
  "Hoses: join the crankcase, valve cover and intake. Rubber cracks with heat and age.",
  "Oil separator: removes oil mist from the gas before it enters the intake.",
  "Diaphragm (on some engines): a thin membrane in the cover that can tear and leak.",
]
faults = [
  "A cracked hose or torn diaphragm: a hissing sound, rough idle, lean codes and high fuel trims.",
  "A valve stuck closed or blocked: oil leaks from seals, oil in the air filter box, and sludge.",
  "A valve stuck open: rough or high idle and lean running, as with any vacuum leak.",
  "Oil in the intake pipe: a stuck or torn valve pulls oil vapour in. Oil use alone does not prove the PCV system is at fault.",
]
more_detail = [
  "A simple check on some engines: pinch the PCV hose with the engine idling. A healthy valve changes the idle. If nothing changes, the valve may be blocked, or the leak is elsewhere.",
]
related = ["pattern-vacuum-leak", "fuel-trim", "air-intake", "turbocharger", "egr-system", "term:PCV valve", "term:Blow-by", "term:Oil separator", "code:P0171"]
sources = [
  "Wikipedia, 'Positive crankcase ventilation' (read 2026-10-16)",
  "Auto Training Centre, 'Bad PCV Valve Symptoms: Rough Idle, and Vacuum Leaks' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "secondary-air"
title = "Secondary air injection"
group = "systems"
aliases = ["secondary air", "secondary air injection", "air pump", "smog pump"]
summary = "A small pump blows fresh air into the exhaust after a cold start to burn pollution and heat the converter."
body = [
  "A cold engine runs rich and makes a lot of unburnt fuel and carbon monoxide. The catalytic converter is also too cold to clean it. The secondary air system pumps fresh air into the exhaust just after the engine starts.",
  "The extra oxygen lets the unburnt gas burn in the exhaust. This heats the converter so the engine computer can start closed-loop control sooner. Run time varies by car: reports range from about 30 to 120 seconds, and one maker reference says 90 to 120 seconds.",
  "You may hear a whirr or hum from the engine bay for a short time after a cold start. That is normal on cars with this system.",
]
how_to_read = [
  "Codes P0410 to P0419 cover the system. P0411 means incorrect flow, often a blocked or stuck valve.",
  "The Readiness screen shows a secondary air monitor on cars that have one. It runs soon after a cold start.",
]
parts = [
  "Air pump: an electric pump driven by a relay. It is not built for continuous use.",
  "Combination valve: a check valve that stops hot exhaust going back to the pump.",
  "Switching solenoid (some designs): opens vacuum to the valve.",
  "Hoses and pipes: lead air to the exhaust ports or manifold.",
]
faults = [
  "A seized or worn pump: scraping, whistling or no sound at cold start, and a flow code.",
  "A jammed relay: the pump runs too long, overheats, and gives off a charred smell.",
  "A stuck or burnt valve: a flow code.",
  "A blown fuse: the pump is silent and a circuit code is stored.",
]
more_detail = [
  "A failed system seldom hurts driveability, but it keeps the lamp on and fails an emissions test. Some older systems also had aspirated designs, where exhaust pulses draw air through a reed valve with no pump.",
]
related = ["catalytic-converter", "o2-sensor", "closed-loop", "term:Secondary air injection", "guide:secondary-air", "code:P0411", "page:readiness"]
sources = [
  "Wikipedia, 'Secondary air injection' (read 2026-10-16)",
  "MS Motorservice, 'Failure of secondary air pump' (read 2026-10-16)",
]

[[topic]]
id = "dpf"
title = "Diesel particulate filter (DPF)"
group = "systems"
aliases = ["DPF", "diesel particulate filter", "particulate filter", "regeneration", "regen", "soot filter"]
summary = "A filter in a diesel's exhaust that traps soot, then burns it off at high temperature."
body = [
  "Diesel exhaust contains tiny soot particles. The DPF is a ceramic honeycomb with channels blocked at alternate ends. The gas is forced through the walls and the soot stays behind.",
  "Soot builds up, so the filter must clean itself. This is regeneration. In passive regeneration, on a long fast run, the exhaust is hot enough (reports say about 350 to 500 degrees C with a catalyst) to burn soot slowly.",
  "If that is not enough, the engine computer starts an active regeneration. It injects extra fuel late so the exhaust reaches about 600 degrees C or more. This takes 10 to 20 minutes (typical) and is best left to finish.",
]
how_to_read = [
  "A differential pressure sensor compares pressure before and after the filter. On Live data, a high value at a given engine load means the filter is clogging.",
  "Some cars also show soot load, distance since the last regeneration and exhaust temperatures. These need enhanced data and vary by make.",
  "P2002 means the filter's efficiency is below the limit.",
]
parts = [
  "Filter body: ceramic honeycomb, usually cordierite or silicon carbide.",
  "Oxidation catalyst: before or inside the filter, it helps create the heat for burning soot.",
  "Differential pressure sensor: connected by two small pipes before and after the filter.",
  "Exhaust temperature sensors: guard against overheating and show regeneration progress.",
]
faults = [
  "Short trips: the exhaust never gets hot enough, so regeneration is cut short again and again. The filter clogs and a dash lamp comes on.",
  "Ash from burnt oil cannot burn off. It slowly fills the filter and needs a cleaning or a new filter.",
  "A blocked, cracked or leaking sensor pipe gives false pressure readings and can start needless regenerations.",
  "Cordierite melts at about 1200 degrees C, so a badly overloaded filter can melt during regeneration.",
]
more_detail = [
  "If the lamp comes on, a sustained drive at higher speed often lets the regeneration finish. Follow the owner's manual. If it is ignored the car can go into limp mode, and then a workshop forced regeneration or a new filter is needed.",
  "Extra fuel from late injection can run down the cylinder walls and dilute the oil. Check the dipstick if the car often regenerates (unverified for all makes).",
]
related = ["diesel-live-data", "egr-system", "scr-adblue", "warning-lights", "turbocharger", "term:Diesel particulate filter", "term:Regeneration", "term:Soot", "term:Differential pressure sensor", "guide:dpf", "code:P2002"]
sources = [
  "Wikipedia, 'Diesel particulate filter' (read 2026-10-16)",
  "Snap-on, 'DPF Regeneration: A Comprehensive Guide' (read 2026-10-16, via search summary)",
  "Sydney Diesel Centre, 'DPF Regeneration Explained: Diesel Soot, Sensors & Diagnostics' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "scr-adblue"
title = "SCR and AdBlue"
group = "systems"
aliases = ["SCR", "AdBlue", "DEF", "diesel exhaust fluid", "urea injection", "NOx sensor"]
summary = "Selective catalytic reduction sprays a urea liquid (AdBlue) into a diesel's exhaust to turn NOx into nitrogen and water."
body = [
  "SCR cleans NOx from diesel exhaust. A small pump sprays AdBlue, a solution of 32.5 percent urea in water, into the exhaust. Heat turns the urea into ammonia, which reacts with NOx on a catalyst to make nitrogen and water.",
  "The engine computer adjusts the dose from the NOx level measured in the exhaust. NOx sensors before and after the catalyst show how well it works. The tank has its own filler, usually marked in blue.",
  "The computer watches the fluid level. If the tank runs low, the dash shows a warning, then a range countdown, then reduced performance. When the tank is empty the engine will not restart.",
]
how_to_read = [
  "Live data on diesels with SCR may show the AdBlue level, tank temperature and NOx sensor readings. Compare the sensor after the catalyst with the one before it. It should read much lower.",
  "SCR codes are mostly in the P20xx range and are often maker-specific. Check the Fault codes screen for the text Scana has.",
]
parts = [
  "AdBlue tank: holds the fluid. It has a heater and a level sensor.",
  "Pump and injector: send a measured spray into the exhaust.",
  "SCR catalyst: where ammonia and NOx react.",
  "NOx sensors: measure NOx before and after the catalyst.",
  "Control module: sets the dose from engine data.",
]
faults = [
  "Empty tank: warning lamp, then a countdown in kilometres. Top up with real AdBlue; water or a substitute will not work.",
  "Frozen fluid: AdBlue freezes at about minus 11 degrees C. Heaters or engine heat thaw it.",
  "A worn NOx sensor: wrong efficiency codes, even with a good catalyst.",
  "Crystals blocking the injector or pipe: low flow codes and white deposits.",
]
more_detail = [
  "In Australia the fluid is sold as AdBlue, in containers of about 1.5 to 10 litres, at most service stations and auto shops, and at the pump at some truck sites. Never put it in the diesel tank.",
  "The fluid starts to break down at about 60 degrees C, so store it cool and out of the sun. The standard for its quality is ISO 22241 (also called AUS 32).",
]
related = ["diesel-live-data", "dpf", "egr-system", "warning-lights", "term:AdBlue", "term:SCR", "term:NOx", "term:Limp mode", "term:Urea"]
sources = [
  "Wikipedia, 'Diesel exhaust fluid' (read 2026-10-16)",
  "Wikipedia, 'Selective catalytic reduction' (read 2026-10-16)",
  "Ampol, 'AdBlue' (read 2026-10-16, via search summary)",
  "Volkswagen Australia, 'AdBlue' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "cooling-system"
title = "Cooling system"
group = "systems"
aliases = ["cooling system", "radiator", "cooling fan", "overheating", "coolant leak", "pressure cap"]
summary = "Circulates coolant to carry waste heat from the engine to the radiator, and keeps the engine at working temperature."
body = [
  "An engine turns only part of its fuel energy into power. The cooling system carries the rest away as heat. A water pump pushes coolant through passages in the block and head, then to the radiator, where air removes the heat.",
  "A thermostat keeps the engine warm. It stays shut when cold, so the engine warms fast, then opens at a set temperature (195 degrees F, about 90 degrees C, is a common rating) to let coolant flow to the radiator. A fan pulls air through when the car is slow or stopped.",
  "The system is sealed and under pressure from the radiator cap. Typical caps are rated about 0.9 to 1.1 bar (13 to 16 psi). Pressure raises the boiling point: a 50/50 coolant mix under a typical cap boils at about 125 to 130 degrees C (typical). Coolant also feeds the heater core for cabin heat.",
]
how_to_read = [
  "Watch coolant temperature in Live data. A warm engine normally settles near its thermostat rating (about 90 to 105 degrees C is common) and stays steady in traffic.",
  "P0128 means the engine takes too long to warm up: often a thermostat stuck open, but also a coolant sensor fault or a fan running too much.",
  "A reading that climbs while the fan stays off points to the fan, relay or sensor. A reading that disagrees with the gauge and the hoses may mean a faulty sensor.",
]
parts = [
  "Water pump: driven by a belt or chain, circulates coolant.",
  "Thermostat: a wax valve that opens at a set temperature.",
  "Radiator: a core of thin tubes and fins that gives up heat to the air.",
  "Fan: electric or belt-driven, switched by the engine computer.",
  "Pressure cap and expansion tank: hold pressure and take up coolant growth.",
  "Coolant: glycol antifreeze and water with additives. Types (IAT, OAT, HOAT) are not always compatible.",
]
faults = [
  "Low coolant from a leak: temperature climbs, the heater blows cold, a sweet smell. Check hoses, the radiator, the water pump and the head gasket.",
  "Thermostat stuck shut: fast overheating. Low coolant or a blocked radiator can look the same.",
  "Thermostat stuck open: slow warm-up, weak cabin heat, higher fuel use.",
  "Fan not running: fine on the road, overheating in traffic.",
  "Steam bubbles from boiling coolant insulate the metal, so cooling drops suddenly and hot spots can damage the engine.",
]
more_detail = [
  "Never open a hot radiator cap. The coolant is above boiling point and sprays out. Do not mix coolant types, because the additives differ. Use the type the maker lists.",
  "Some engines shut down or cut power when they overheat, to protect themselves.",
]
related = ["pattern-thermostat", "coolant-temp-reading", "coolant-temp-sensor", "pattern-ect-sensor", "term:Thermostat", "term:Coolant", "term:Water pump", "term:Radiator cap", "term:Heater core", "term:Head gasket", "guide:overheat", "guide:thermostat", "guide:fan", "code:P0128"]
sources = [
  "Wikipedia, 'Internal combustion engine cooling' (read 2026-10-16)",
  "Wikipedia, 'Thermostat' (read 2026-10-16)",
  "Garage.co.uk, 'What Are Pressure Ratings for Radiator Caps?' (read 2026-10-16, via search summary)",
  "OBD-Codes.com, 'P0128 Coolant Thermostat' (read 2026-10-16, via search summary)",
