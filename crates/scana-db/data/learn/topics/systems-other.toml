]

[[topic]]
id = "hybrid-system"
title = "Hybrid system"
group = "systems"
aliases = ["hybrid", "hybrid system", "high-voltage battery", "HV battery", "inverter", "regenerative braking", "motor-generator"]
summary = "A petrol engine plus electric motors and a high-voltage battery. Orange cables carry dangerous voltage: never touch them."
body = [
  "A hybrid pairs an engine with one or more motor-generators and a high-voltage battery. Pack voltages vary by car: typically 200 to 400 V, with older small hybrids lower (36 V and 144 V examples exist). An inverter changes battery direct current to alternating current for the motors, and back to charge.",
  "The computer picks the best mix of engine and motor for each moment. When you brake or coast, the motor works as a generator and sends energy to the battery. This is regenerative braking. It saves fuel, and the car turns the engine off at rest.",
  "The ordinary 12 V battery still runs the computers and starts the high-voltage system. A DC-DC converter keeps it charged from the main pack. Zero engine speed while the car is on is normal.",
]
how_to_read = [
  "Generic OBD-II shows the engine and some data. The hybrid computer, with battery voltage, current, temperature and state of charge, usually needs enhanced data. See Modules.",
  "Engine speed of 0 with the car in READY mode is not a fault.",
]
parts = [
  "High-voltage battery: nickel-metal hydride or lithium-ion cells, with cooling and a monitor.",
  "Inverter: converts between battery and motor currents.",
  "Motor-generators: drive the wheels, start the engine and recover energy.",
  "DC-DC converter: charges the 12 V battery.",
  "Orange cables and service disconnect: carry high voltage. The disconnect splits the pack for repairs.",
  "Hybrid control computer: manages the mix and the safety relays.",
]
faults = [
  "A weak 12 V battery: the car will not go READY, with many odd warnings.",
  "Battery cooling air blocked by dust or items: the pack overheats and power drops.",
  "A weak battery cell: less range of charge, the engine runs more, a hybrid system lamp.",
  "An insulation fault: the computer shuts down the high voltage and shows a warning.",
]
more_detail = [
  "Safety: high-voltage cables are usually orange. Do not cut, probe or open them, or the battery. DC becomes dangerous at about 55 to 60 V. Makers give wait times of 5 to 15 minutes after shutdown for capacitors to discharge. A hybrid can restart its engine on its own, even when it looks off. Only trained people with insulated gloves and the service disconnect removed should work on the high-voltage system.",
]
related = ["hybrid-live-data", "battery", "charging-system", "starting-system", "car-networks", "term:Inverter", "term:Regenerative braking", "term:Stop-start", "page:modules"]
