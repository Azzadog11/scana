[[topic]]
id = "charging-system"
title = "Charging system"
group = "systems"
aliases = ["charging system", "alternator charging", "smart charging", "battery sensor"]
summary = "The alternator makes electricity while the engine runs, to power the car and keep the 12 V battery charged."
body = [
  "A belt turns the alternator. It makes alternating current and a rectifier (a set of diodes) turns it into direct current. A voltage regulator holds the system voltage steady by changing the small field current in the rotor.",
  "On many newer cars the engine computer controls the alternator. A battery sensor on the battery measures current, voltage and temperature, and the computer sets a target voltage, often over a LIN line. This is smart charging.",
  "With smart charging, the voltage changes with driving. It may drop to about 12.5 V when the battery is full and rise to 14.5 V or more when slowing down, to recover energy. This is normal.",
]
how_to_read = [
  "On Live data, control module voltage with the engine running is usually near 13.5 to 14.8 V on a conventional system, and varies on smart charging. At key-on, engine off, it shows battery voltage.",
  "A reading that stays at battery voltage or falls while running means the battery is not being charged.",
  "P0562 means system voltage is low.",
]
parts = [
  "Alternator: generates power, with a rectifier and a regulator.",
  "Drive belt and tensioner: turn the alternator.",
  "Battery sensor: measures battery current, voltage and temperature on smart systems.",
  "Charge warning lamp: a red battery shape. It lights with the key on and goes out when the alternator makes power.",
  "Cables and grounds: carry the current. Corroded ones act as a fault.",
]
faults = [
  "Worn alternator: red battery lamp, dim lights, a whine or a flat battery.",
  "Loose or slipping belt: squealing and intermittent charging.",
  "Corroded terminals and grounds: voltage drops and odd faults, with a battery that seems fine.",
  "Overcharging: a hot, bubbling or swollen battery and burnt bulbs.",
]
more_detail = [
  "On cars with smart charging, a new battery often needs registering with the computer so the charge plan matches its type. A simple second-battery link can also fail to charge. Check the workshop manual.",
]
related = ["pattern-charging", "voltage-reading", "battery", "starting-system", "warning-lights", "car-networks", "term:Alternator", "term:Voltage regulator", "term:Smart charging", "term:Parasitic drain", "guide:charging", "code:P0562", "pid:42"]
sources = [
  "Wikipedia, 'Alternator (automotive)' (read 2026-10-16)",
  "Vehicle Service Pros, 'What Makes Today's Charging Systems Smart?' (read 2026-10-16, via search summary)",
  "12voltplanet.co.uk, 'Auxiliary Battery Charging In Vehicles With Smart Alternators' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "starting-system"
title = "Starting system"
group = "systems"
aliases = ["starting system", "starter motor", "starter", "no-crank", "starter relay", "cranking"]
summary = "A battery-powered electric motor that spins the engine fast enough to start. Several switches must agree first."
body = [
  "The starter motor is a strong electric motor that turns the flywheel through a small gear. A solenoid on it pushes the gear into mesh and closes a heavy switch. A one-way clutch stops the engine from driving the starter once it fires.",
  "A small current from the ignition switch or push button feeds the solenoid, sometimes through a relay. Safety inputs must agree first: park or neutral on an automatic, or the clutch pedal on a manual. On many cars the immobiliser must also accept the key.",
  "Starters are built for short use, typically under 30 seconds before they overheat. Long cranking or holding the key in start can burn the contacts and brushes.",
]
how_to_read = [
  "On Live data, engine speed while cranking is typically around 200 rpm or more. Denso tests starters at about 200 to 250 rpm. Lower means a weak battery or starter.",
  "Battery voltage while cranking should stay above about 9.6 V at normal temperature (typical for a 12 V system). Lower means a weak battery or poor cables.",
  "No engine speed signal while cranking points to a crank sensor fault, not a starter fault.",
]
parts = [
  "Starter motor and solenoid: turn the engine.",
  "Starter relay: lets a small signal switch a larger current.",
  "Ignition switch or start button: starts the sequence.",
  "Neutral safety switch or clutch switch: prevents starting in gear.",
  "Immobiliser: checks the key and can block starting or fuel.",
  "Battery and cables: carry the current.",
]
faults = [
  "Click but no crank: the solenoid gets too little voltage (weak battery, poor connection), or its contacts are burnt.",
  "No sound at all: a poor ignition switch connection, a blown fuse, a faulty relay, or a clutch or neutral switch that is not closing.",
  "Slow crank: a weak battery, corroded connections, or high resistance in the circuit.",
  "Starter spins but the engine does not turn: worn flywheel teeth or a worn starter drive.",
  "Cranks fast but will not start: a different problem. Check fuel, spark and the immobiliser lamp.",
]
more_detail = [
  "A voltage drop test finds high resistance. Denso gives 0.5 V or less from battery positive to the starter, and 0.2 V or less on the earth side, while cranking.",
  "Some immobilisers let the starter spin but stop fuel or spark. Others stop the starter too.",
]
related = ["battery", "charging-system", "body-control", "crank-sensor", "manual-and-4wd", "term:Immobiliser", "term:Relay", "term:Voltage drop", "guide:no-start", "guide:flat-battery", "pid:0C"]
sources = [
