[[topic]]
id = "battery"
title = "12 V battery"
group = "systems"
aliases = ["battery", "12 V battery", "car battery", "AGM", "EFB", "cold cranking amps", "CCA", "flat battery"]
summary = "The lead-acid battery that starts the engine and powers the electronics when the engine is off."
body = [
  "A car battery has six lead-acid cells of about 2.1 V each, giving about 12.6 V when full and rested. It supplies the huge starting current, then the alternator refills it.",
  "Cars with stop-start use stronger types. EFB (enhanced flooded) has liquid acid and copes with many cycles. AGM (absorbed glass mat) holds the acid in glass mats and suits deeper cycling and energy recovery. Most makers advise replacing like with like.",
  "Cold cranking amps (CCA) rate how much current a battery gives for a cold start. Heat shortens battery life more than cold. In hot parts of Australia, pick a battery built for heat and expect a shorter life.",
]
how_to_read = [
  "Rested battery, engine off, typical flooded battery: 12.6 V or more is full, 12.4 V about 75 percent, 12.2 V about 50 percent, 12.0 V about 25 percent. Charts differ a little. AGM reads slightly higher when full, about 12.7 to 12.9 V.",
  "Cranking should not pull the voltage below about 9.6 V (typical). Engine running should show about 13.5 to 14.8 V on a conventional system.",
  "Resting voltage shows charge, not health. A tired battery can read 12.6 V and still fail under load.",
]
parts = [
  "Plates and cells: lead plates in dilute sulphuric acid.",
  "Terminals: where cables clamp. Corrosion here causes bad starts.",
  "Battery sensor (some cars): reports current, voltage and temperature to the computer.",
]
faults = [
  "Sulphation: a battery left discharged grows lead sulphate crystals and loses capacity.",
  "Heat damage: long hot spells speed up wear. Sources say the same battery type can last noticeably fewer months in a hot region.",
  "Corroded or loose terminals: slow cranking and odd electrical faults.",
  "A parasitic drain: a flat battery after a few days, because a module does not go to sleep.",
]
more_detail = [
  "A proper test uses a load tester or a conductance tester. A full recharge of a typical car battery takes about 6 to 12 hours. Fit the same technology as the original: a plain flooded battery in a stop-start car wears out fast. Batteries make explosive hydrogen when overcharged, so keep sparks away.",
]
related = ["charging-system", "starting-system", "voltage-reading", "pattern-charging", "hybrid-system", "term:Parasitic drain", "term:Cold cranking amps", "term:AGM", "term:Stop-start", "term:Resting voltage", "guide:flat-battery", "pid:42"]
sources = [
  "Wikipedia, 'Lead-acid battery' (read 2026-10-16)",
  "Voltage Basics, 'Resting Voltage of Car Battery Chart' (read 2026-10-16, via search summary)",
  "Continental Battery, 'What Are EFB Batteries? (And When to Use Them)' (read 2026-10-16, via search summary)",
  "Stryten, 'EFB vs. AGM for Start-Stop and Hybrid Vehicles' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "automatic-transmission"
title = "Automatic transmission"
group = "systems"
aliases = ["automatic transmission", "automatic gearbox", "auto gearbox", "transmission fluid", "shift solenoids", "gearbox computer"]
summary = "A gearbox that changes gears by itself, using fluid pressure and a computer that reads speed and load."
body = [
  "A torque converter takes the place of a clutch. It is a fluid coupling between engine and gearbox. Many have a lock-up clutch that joins the two at cruise, to stop slip and save fuel.",
  "The gears are planetary sets. Clutches and bands hold or free parts of the set to make each ratio. A valve body sends fluid pressure to them, and solenoids controlled by the computer set the pressure.",
  "The gearbox computer reads vehicle speed, engine load and shaft speeds. It picks the gear and changes the pressure for smooth shifts. It also learns: it adapts clutch pressure as parts wear, to keep shifts the same.",
]
how_to_read = [
  "Compare engine speed with road speed and the commanded gear. If the revs rise and the car does not accelerate, a clutch is slipping.",
  "Normal fluid temperature is about 80 to 93 degrees C. Sources say above roughly 105 to 115 degrees C the fluid wears fast (typical; the maker decides).",
  "P0730 means incorrect gear ratio and P0741 a lock-up clutch performance fault. Codes from the gearbox computer may only show in its own module on the Modules screen.",
]
parts = [
  "Torque converter: fluid coupling with a lock-up clutch.",
  "Planetary gear sets, clutches and bands: make the gear ratios.",
  "Valve body and solenoids: direct and set the pressure.",
  "Speed sensors: read input and output shaft speeds.",
  "Fluid (ATF) and filter: work as hydraulic fluid, lubricant and coolant.",
  "Gearbox computer: decides the shifts. It may be inside the gearbox.",
]
faults = [
  "Slipping: revs rise between gears, often from worn clutches or low fluid.",
  "Harsh or delayed shifts: a worn solenoid, dirty fluid or a clogged filter.",
  "Shudder at cruise: the lock-up clutch grabbing, sometimes helped by a fluid change.",
  "Dark, burnt-smelling fluid: overheating. Many cars have a sealed gearbox with no dipstick.",
  "Limp mode: stuck in one gear, often after a speed sensor or solenoid fault.",
]
more_detail = [
  "After a valve body, solenoid or clutch repair, or a new gearbox computer, the learned values may need a reset and a relearn drive. Makers publish different procedures, so follow the one for the car. Check the fluid level and condition first.",
  "Use the fluid the maker specifies, as friction properties differ.",
]
related = ["cvt", "manual-and-4wd", "car-networks", "uds", "term:Torque converter", "term:TCC", "term:Shift solenoid", "term:Valve body", "term:ATF", "term:Gearbox computer", "term:Limp mode", "guide:transmission", "code:P0730", "code:P0741", "page:modules"]
sources = [
  "Wikipedia, 'Automatic transmission' (read 2026-10-16)",
  "NHTSA, 'Information on Transmission Adaptive Functions' service bulletin MC-10112288-9999 (read 2026-10-16, via search summary)",
  "Mechanic Base, 'What Transmission Temperature Is Considered Normal?' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "cvt"
title = "CVT (continuously variable transmission)"
group = "systems"
aliases = ["CVT", "continuously variable transmission", "CVT fluid", "variator"]
summary = "A gearbox with no fixed gears: a belt or chain runs between two pulleys that change size."
body = [
  "A CVT has two pulleys made of cone halves, joined by a steel belt or chain. When the halves of one pulley move together, the belt rides higher. The other pulley opens so the belt rides lower. The ratio changes smoothly, with no steps.",
  "Hydraulic pressure moves the pulleys and also grips the belt. The computer picks the ratio so the engine runs at a good speed for the load. That is why revs can stay steady while the car speeds up.",
  "A start-off device takes the place of the clutch: a torque converter or a clutch pack. Many CVTs add fake steps in software so they feel like a normal automatic.",
]
how_to_read = [
  "Compare engine speed with road speed. The ratio on an enhanced scan should change smoothly. Revs that surge without more speed point to belt slip.",
  "P0730 means incorrect ratio and P0841 a fluid pressure sensor range fault. Many CVT codes are maker-specific, and some show only in the gearbox module on the Modules screen.",
]
parts = [
  "Primary and secondary pulleys: the two pairs of cones that set the ratio.",
  "Belt or chain: transmits torque.",
  "Hydraulic pump and valves: set pulley and belt pressure.",
  "Start-off device: torque converter or clutch.",
  "Gearbox computer: picks the ratio and pressure.",
]
faults = [
  "Judder or shudder when pulling away: the most common cause is old fluid that has lost its friction properties. Worn pulleys and a faulty pressure control are others.",
  "Whine that changes with speed: bearing wear or belt and pulley wear.",
  "Overheating: sustained high torque such as towing or long hills can overheat the fluid, trigger a warning or limp mode, and wear the belt.",
  "Slip under load: revs rise but speed does not. A damaged belt or pulley is expensive to fix.",
]
more_detail = [
  "CVTs need the fluid the maker names. Normal automatic fluid has the wrong friction, and the belt may slip. Change intervals are often shorter than owners expect: follow the workshop manual.",
]
related = ["automatic-transmission", "manual-and-4wd", "term:CVT", "term:Gearbox computer", "term:Torque converter", "guide:transmission", "code:P0730", "code:P0841", "page:modules"]
sources = [
  "Wikipedia, 'Continuously variable transmission' (read 2026-10-16)",
  "Gearbox Insider, 'CVT Transmission Jerking and Shuddering: Symptoms, Causes and Fix' (read 2026-10-16, via search summary)",
  "MyCarFault, 'CVT Transmission Problems: Belt Wear, Shudder, Overheating & Repair Costs' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "manual-and-4wd"
title = "Manual gearbox and 4WD"
group = "systems"
aliases = ["manual gearbox", "manual transmission", "clutch switch", "neutral switch", "4WD", "4x4", "transfer case", "free-wheeling hubs", "four-wheel drive"]
summary = "Manual gearboxes and part-time four-wheel drive, with the switches and modules a scan tool can read."
body = [
  "A manual gearbox is a set of gears the driver picks with a lever and a clutch pedal. The computers do not change gears. They read switches: the clutch pedal switch, which lets the engine crank only with the pedal down, and the neutral or gear switch.",
  "A part-time 4WD truck adds a transfer case behind the gearbox. A lever or switch picks 2H (rear wheels, high range), 4H (all wheels, high range) or 4L (all wheels, low range). Low range gives extra gear reduction and torque for slow, rough going and towing.",
  "In 4H and 4L the front and rear shafts are locked together, so they cannot turn at different speeds. Use it on loose ground only. On dry sealed roads the driveline winds up and can be damaged.",
]
how_to_read = [
  "Live data may show the clutch switch and neutral switch as on or off. Press the pedal and watch the value change. If nothing changes, the switch or its wiring is at fault.",
  "P0704 points to the clutch switch circuit and P0850 to the park or neutral switch circuit.",
  "4WD faults are often held in the 4WD module, so read the Modules screen. Many codes are maker-specific.",
]
parts = [
  "Clutch pedal switch: tells the computer the clutch is pressed.",
  "Neutral or reverse switch: shows the gear position, for starting, stop-start and lights.",
  "Transfer case: splits drive between front and rear and gives low range.",
  "Free-wheeling hubs: connect or disconnect the front axle from the front wheels. In 2H they let the front driveline stand still. Some lock by hand, some automatically.",
  "4WD switch or module: drives an electric motor or vacuum actuator and watches position.",
]
faults = [
  "Engine will not crank: a failed clutch switch is a common cause. A jumper across the switch shows whether it is the problem.",
  "Hubs not locked: the 4WD lever is in 4H but the front wheels are still free, so the truck is really 2WD.",
  "Driveline bind and hopping in tight turns on dry road: 4H used on sealed ground.",
  "Grinding when engaging a gear: a worn clutch or synchromesh.",
]
more_detail = [
  "Range and hubs are two separate steps on many trucks: lock the hubs, then select 4H or 4L. Shifting into 4H on the move is allowed at low speed on some trucks; low range needs the truck stopped and the gearbox in neutral. Check the owner's manual.",
]
related = ["starting-system", "automatic-transmission", "abs-system", "body-control", "term:Transfer case", "term:Vehicle speed sensor", "term:Relay", "term:Solenoid", "page:modules", "code:P0704", "code:P0850"]
sources = [
  "Wikipedia, 'Transfer case' (read 2026-10-16)",
  "Wikipedia, 'Locking hubs' (read 2026-10-16, via search summary)",
  "aa1car.com, '4WD Locking Hubs' (read 2026-10-16, via search summary)",
  "TPUB, 'Clutch Start Switch' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "abs-system"
title = "ABS (anti-lock brakes)"
group = "systems"
aliases = ["ABS", "ABS system", "ABS light", "anti-lock brakes", "anti-lock braking system", "wheel speed sensors"]
summary = "ABS stops the wheels locking in a hard stop, so you can still steer while braking."
body = [
  "A sensor at each wheel reads a toothed or magnetic ring that turns with it. The ABS module compares the four speeds. If one wheel slows much faster than the others, it is about to lock.",
  "The module then uses valves in the hydraulic modulator to release and re-apply pressure to that brake, many times a second. A pump restores pressure. You feel a buzzing pedal, which is normal.",
  "If the ABS fails, a lamp lights and anti-lock turns off. The normal brakes usually still work. The same sensors also feed stability control and the speedometer.",
]
how_to_read = [
  "A standard OBD-II scan reaches the engine and gearbox. ABS codes (start with C) need the ABS module. See Modules.",
  "In the module's data, compare all four wheel speeds while driving slowly. One that reads zero or jumps points to that sensor, its wiring or its ring.",
  "Some cars also show brake switch status and pump motor current.",
]
parts = [
  "Wheel speed sensors: Hall-effect or coil sensors at each wheel. Coil types read weakly at very low speed.",
  "Tone ring (or encoder): a toothed or magnetic ring on the hub that produces the signal.",
  "ABS module and hydraulic modulator: the computer, valves and pump.",
  "Brake pedal switch: tells the module the brakes are applied.",
]
faults = [
  "A cracked, rusty or dirty tone ring: ABS lamp, often with a code for one wheel sensor.",
  "A damaged sensor cable or corroded connector: a lamp that comes and goes.",
  "A wrong sensor gap or worn bearing: a weak signal, sometimes with ABS acting at low speed just before a stop.",
  "ABS lamp together with the red brake lamp or a soft pedal: stop and check brake fluid.",
]
more_detail = [
  "Clogged valves are the most common valve problem in the modulator. After some repairs, the module needs a scan-tool bleed procedure.",
]
related = ["stability-control", "car-networks", "warning-lights", "term:ABS", "term:Wheel speed sensor", "term:Tone ring", "term:Module", "guide:abs-wheel-speed", "page:modules"]
sources = [
  "Wikipedia, 'Anti-lock braking system' (read 2026-10-16)",
  "AUTODOC Club, 'ABS sensor in car: functions and failure symptoms of a wheel speed sensor' (read 2026-10-16, via search summary)",
  "PartCatalog, 'Bad ABS Tone Ring Symptoms: Warning Signs Guide' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "stability-control"
title = "Stability and traction control"
group = "systems"
aliases = ["stability control", "ESC", "ESP", "traction control", "TCS", "yaw sensor", "steering angle sensor"]
summary = "Compares where the driver steers with where the car goes, and brakes single wheels to correct a skid."
body = [
  "Stability control (ESC) reads the steering angle, the car's yaw rate (how fast it turns about an upright axis), sideways acceleration and wheel speeds. It works out where the driver wants to go and where the car is going.",
  "If they differ, the car is sliding. The system brakes one wheel to turn the car back, and may cut engine power. Braking the outer front wheel corrects oversteer; braking the inner rear wheel corrects understeer.",
  "Traction control is the simpler part. If a driven wheel spins faster than the others, it brakes that wheel or cuts power. It uses the ABS sensors and hydraulic unit.",
]
how_to_read = [
  "Most cars flash the stability lamp when the system works. A steady lamp means a fault or that the system was switched off.",
  "In the ABS or ESC module's data, steering angle should read near zero when driving straight, and rise smoothly as you steer. Yaw rate should be near zero when stopped.",
  "Codes begin with C and are read from the ABS module. See Modules.",
]
parts = [
  "Steering angle sensor: measures wheel position.",
  "Yaw rate and lateral acceleration sensors: measure turning and sideways force.",
  "Wheel speed sensors: shared with ABS.",
  "Hydraulic unit with a pump: builds pressure to brake a single wheel.",
  "Engine and gearbox computers: take torque requests over the network.",
]
faults = [
  "Lost steering angle calibration after an alignment, a steering repair or a battery disconnect: the system switches itself off and a lamp comes on. This is usually calibration, not a failed part.",
  "A failed wheel speed signal: stability and traction control stay disabled until it is repaired.",
  "Mismatched tyre sizes or a spare wheel: wheel speeds disagree.",
  "Low battery voltage: stability lamp with a collection of odd lamps.",
]
more_detail = [
  "After an alignment or steering repair, calibrate the steering angle sensor once the alignment is within specification. Calibrating first means doing it twice. The procedure varies by make: some cars need a scan tool and some relearn after a lock-to-lock turn. Follow the workshop manual.",
]
related = ["abs-system", "car-networks", "warning-lights", "term:Stability control", "term:Traction control", "term:Steering angle sensor", "term:Yaw rate", "page:modules"]
sources = [
  "Wikipedia, 'Electronic stability control' (read 2026-10-16)",
  "Apex Tech Nation, 'Steering Angle Sensor Calibration: When and How to Do It' (read 2026-10-16, via search summary)",
  "I-CAR RTS, 'Typical Calibration Requirements For Steering Angle/Position Sensors' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "airbag-srs"
title = "Airbags (SRS)"
group = "systems"
aliases = ["airbag", "airbags", "SRS", "SRS light", "airbag light", "clock spring", "seat belt pretensioner", "supplemental restraint system"]
summary = "Crash sensors and a computer fire airbags and belt pretensioners within milliseconds of a hard impact."
body = [
  "The airbag computer reads accelerometers in itself and in the front and sides of the car, plus other inputs such as seat sensors. When the pattern matches a crash, it sends current to the igniter in each bag or belt it chooses. The bag inflates in about 20 to 30 milliseconds and is full within about 60 to 80 milliseconds of first contact.",
  "Pretensioners pull the seat belt tight in a crash. A clock spring (a coiled ribbon cable behind the steering wheel) carries the driver airbag wires while the wheel turns. Occupant sensing in the passenger seat decides whether that airbag may fire.",
  "At key-on the SRS lamp lights for a few seconds and goes out. If it stays on or flashes, the system has a fault and may not fire. The computer also stores crash data.",
]
how_to_read = [
  "Generic OBD-II does not read airbag codes. A scan tool needs the SRS module, see Modules. Codes usually start with B.",
  "Typical faults: a clock spring open circuit, a seat belt buckle switch, a seat occupancy sensor, a crash sensor or an unplugged connector.",
  "After a crash or deployment, the computer usually has to be replaced or reset by a workshop.",
]
parts = [
  "Airbag control module: reads the sensors and decides.",
  "Crash sensors: accelerometers and pressure sensors in the front and sides.",
  "Airbags and igniters: driver, passenger, side, curtain and knee bags.",
  "Clock spring: connects the steering wheel to the car's wiring.",
  "Pretensioners: pyrotechnic belt tighteners.",
  "Occupant sensor and buckle switches: tell the module who is seated and belted.",
]
faults = [
  "SRS lamp on after seat removal or wiring work: an unplugged seat connector.",
  "A faulty clock spring: lamp on, a dead horn or dead steering wheel buttons.",
  "Passenger airbag off lamp when a person sits there: a seat sensor fault.",
  "Water under a seat: a corroded connector and a lamp.",
]
more_detail = [
  "Safety: do not probe airbag wires, test igniters with a meter or open an airbag. They can fire. Airbag systems can stay live for a while after the battery is disconnected (one reference says up to 30 minutes). Wait the time the workshop manual gives.",
]
related = ["body-control", "warning-lights", "car-networks", "term:SRS", "term:Clock spring", "term:Pretensioner", "term:Occupant sensor", "guide:airbag", "page:modules"]
sources = [
  "Wikipedia, 'Airbag' (read 2026-10-16)",
  "My Airbags knowledge base, 'How Fast Do Airbags Deploy?' (read 2026-10-16, via search summary)",
  "ScienceABC, 'How Do Airbags Deploy So Fast In A Car Accident?' (read 2026-10-16, via search summary)",
]

[[topic]]
id = "body-control"
title = "Body control and immobiliser"
group = "systems"
aliases = ["body control module", "body computer", "BCM", "central locking", "key fob", "comfort features", "immobiliser key"]
summary = "A body computer runs the lights, locks, windows, wipers and key checks, and talks to the other modules over the networks."
body = [
  "The body control module (BCM) is the computer for the cabin and outside lights. It switches relays for things like central locking, windows, mirrors and turn signals. Some cars have several smaller body modules instead of one.",
  "It also handles the key in many cars. A transponder chip in the key replies to a coil around the ignition. The engine computer compares the code with its stored one and only then allows fuel and spark. Newer keys use rolling codes or encryption.",
  "The BCM talks to other computers over the CAN bus. Pressing a window switch can send a message, not run a wire to the motor. That saves wiring but means one module can affect another.",
]
how_to_read = [
  "Body faults use codes beginning with B and are read from the BCM, not the engine computer. See Modules.",
  "Adding or replacing a key usually needs a scan tool or dealer tool and a security code.",
  "U codes mean one module lost contact with another. Check the battery and the network first.",
]
parts = [
  "Body control module: reads inputs and drives outputs.",
  "Immobiliser coil and key transponder: check the key.",
  "Key fob receiver: takes remote lock and unlock signals.",
  "Door, window and lamp modules: smaller computers, often on LIN lines.",
  "Fuse and relay box: carries the load currents.",
]
faults = [
  "Low battery: random messages and lamps, locks acting by themselves.",
  "A module that does not sleep: a flat battery overnight.",
  "A worn key fob battery: poor remote range.",
  "A flashing key lamp and no start: the immobiliser did not accept the key. Some cars then lock out starting for a time.",
  "Water in the module or a corroded connector: wipers or lights working at random.",
]
more_detail = [
  "Immobilisers deter theft but are not unbeatable. Scana only reads. Key and security functions are best left to the maker's process.",
]
related = ["car-networks", "starting-system", "airbag-srs", "warning-lights", "uds-security-routines", "term:BCM", "term:Immobiliser", "term:Module", "term:Gateway", "term:Parasitic drain", "page:modules"]
sources = [
  "Wikipedia, 'Body control module' (read 2026-10-16)",
  "Wikipedia, 'Immobiliser' (read 2026-10-16)",
]

[[topic]]
id = "warning-lights"
title = "Dash warning lights"
group = "systems"
aliases = ["warning lights", "warning light", "dash lights", "dashboard lights", "check engine light", "oil light", "battery light", "temperature light"]
summary = "Lamps on the dash that show a fault or a state. Red usually means stop, amber means get it checked."
body = [
  "Colour tells urgency. Red means a serious fault or a safety risk: stop when safe. Amber or yellow means a fault to check soon. Green, white and blue mean a system is working or in use, such as headlights or cruise control.",
  "Lamps light briefly at key-on to show the bulbs work. They should go out when the engine starts. A lamp that stays on has its own source: the engine computer or another module.",
  "A scan tool can explain only some. The check engine lamp (MIL) is a generic OBD-II lamp. Others, like ABS, SRS and DPF lamps, belong to other modules. Clearing codes turns the MIL off but does not fix the cause.",
]
how_to_read = [
  "Check engine (amber engine shape): read codes on the Fault codes screen. Flashing usually means a serious misfire that can damage the converter: stop soon.",
  "ABS (amber): the anti-lock is off, normal brakes usually work. SRS or airbag (red): the airbags may not fire. Both need that module in Modules.",
  "Battery (red): the charge system is not charging. Oil pressure (red oil can): pressure is too low, so stop the engine, then check the level. The lamp is usually driven by a pressure switch, but some cars use a pressure sensor, and some have a separate oil level sensor.",
  "Temperature (red thermometer): the engine is too hot. Stop safely and let it cool.",
  "DPF (amber filter): soot is high, so take a longer drive. Glow plug (amber coil): on while heating, flashing for a fault.",
]
parts = [
  "Instrument cluster: the module that shows the lamps. It listens on the network.",
  "Switches and sensors: oil pressure switch, brake fluid level switch.",
  "Other modules: send a lamp message when they find a fault.",
]
faults = [
  "A lamp that does not light at key-on: a blown bulb or LED, so it cannot warn you.",
  "Many lamps at once with no real fault: low voltage or a network fault.",
  "A lamp that stays on after a repair: the code needs clearing, or a drive cycle must complete.",
  "An oil lamp with a good oil level: a faulty switch or sensor is one cause, but check pressure with a gauge before you assume it.",
]
more_detail = [
  "Symbols are mostly standard across makes, but colours and rules vary. The owner's manual lists the lamps for that car.",
]
related = ["abs-system", "airbag-srs", "dpf", "charging-system", "cooling-system", "body-control", "scr-adblue", "term:MIL", "term:Instrument cluster", "term:Glow plug", "page:codes"]
sources = [
  "RAC, 'Dashboard warning lights: all symbols explained' (read 2026-10-16, via search summary)",
  "The AA, 'Engine management light' (read 2026-10-16, via search summary)",
  "aa1car.com, 'What To Do If Your Engine Oil Pressure Warning Light Is On' (read 2026-10-16)",
