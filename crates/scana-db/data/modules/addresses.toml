# Where modules usually answer diagnostic requests, by maker family. Scana uses these names
# only as hints ("probably the ABS computer") until a module gives its own name.
#
# Addresses: an 11-bit request ID ("7B0", the reply comes from 7B8), an ID with an address
# byte for modules behind a gateway ("750/40": request 750 with first byte 40, reply 758),
# or a 29-bit request ID ("18DA28F1").
#
# Family "any" applies to every car. Family "toyota" covers Toyota, Lexus and Scion, and is
# assumed for Daihatsu (part of the Toyota group) until discovery on a real Daihatsu confirms it.
#
# Sources (every `source` value below is one of these tags; addresses only, no firmware data):
#   [iso]       ISO 15765-4 addressing as used by SAE J1979: 0x7E0-0x7E7 are the OBD-II ECUs.
#   [opendbc]   openpilot's opendbc (MIT licence, github.com/commaai/opendbc, read 2026-10-16
#               and 2026-10-17): firmware query addresses in opendbc/car/<make>/values.py and
#               opendbc/car/<make>/fingerprints.py for toyota, mazda, hyundai, ford, nissan,
#               subaru, honda, volkswagen, chrysler and gm. Ecu types were turned into plain names.
#   [toyotadx]  github.com/kaikozlov/toyota-diagnostics README (read 2026-10-16).
#   [wmi]       Wikipedia, "Vehicle identification number", world manufacturer identifier list
#               (en.wikipedia.org/wiki/Vehicle_identification_number, read 2026-10-17). It
#               feeds the VIN prefix table in `src/modules.rs`, not an address.
#
# Reply IDs: modules usually reply from request ID + 8 (11-bit) or with source and target
# swapped (29-bit). Discovery accepts a tester-present answer from any 11-bit ID in
# 0x700-0x7FF, so makes that reply elsewhere in that range (nissan +0x20, vw +0x6A) are found
# and named by their request ID. Replies outside that range need the `[[family]]` table below
# (chrysler: request - 0x280, so 747 replies from 4C7). Not found at all: gm, whose requests
# are 0x2xx IDs outside the probed range 0x700-0x7F7. The only gm address here is a camera
# at 24B, kept for naming. What opendbc shows [opendbc]:
#   gm         replies from request + 0x400
#   nissan     most modules reply from request + 0x20, some engines at + 8
#   chrysler   ABS, steering, airbag, radar and cluster (11-bit) reply from request - 0x280;
#              engine, gearbox and hybrid reply at + 8
#   vw         airbag, steering, radar and camera reply from request + 0x6A; engine and
#              gearbox reply at + 8
# Families without a gateway entry: opendbc shows no address-byte gateway for them.
# Families mazda, ford and hyundai answer on the plain +8 rule. Mazda and Ford share their
# ABS, steering, camera and radar addresses (760, 730, 706, 764), as opendbc lists them.
# Several 11-bit addresses are used by different modules in different families (for example
# 730 and 760): the family decides the name.

# Extra reply offsets (reply ID minus request ID, in decimal because TOML has no negative
# hex) that discovery accepts for a family, next to the usual +8 and the 0x700-0x7FF rule.
[[family]]
name = "chrysler"
reply_offsets = [-640] # -0x280, CHRYSLER_RX_OFFSET
source = "opendbc"

[[family]]
name = "nissan"
reply_offsets = [32] # +0x20, NISSAN_RX_OFFSET
source = "opendbc"

[[family]]
name = "vw"
reply_offsets = [106] # +0x6A, VOLKSWAGEN_RX_OFFSET
source = "opendbc"

[[family]]
name = "gm"
reply_offsets = [1024] # +0x400, GM_RX_OFFSET
source = "opendbc"

[[gateway]]
family = "toyota"
id = "750"
note = "Body, camera, radar and other modules answer through 750 with an address byte; replies come from 758 [opendbc]"

