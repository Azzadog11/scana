# Where modules usually answer diagnostic requests, by maker family. Scana uses these names
# only as hints ("probably the ABS computer") until a module gives its own name.
#
# Addresses: an 11-bit request ID ("7B0", the reply comes from 7B8), an ID with an address
# byte for modules behind a gateway ("750/40": request 750 with first byte 40, reply 758),
# or a 29-bit request ID ("18DA28F1").
#
# Family "any" applies to every car. Family "toyota" covers Toyota, Lexus and Scion, and is
# assumed for Daihatsu (part of the Toyota group) until discovery on a real Daihatsu confirms it.
#
# Sources:
#   [iso]       ISO 15765-4 addressing as used by SAE J1979: 0x7E0-0x7E7 are the OBD-II ECUs.
#   [opendbc]   openpilot's opendbc, opendbc/car/toyota/values.py and fingerprints.py
#               (github.com/commaai/opendbc, read 2026-10-16): firmware query addresses.
#   [toyotadx]  github.com/kaikozlov/toyota-diagnostics README (read 2026-10-16).

[[gateway]]
family = "toyota"
id = "750"
note = "Body, camera, radar and other modules answer through 750 with an address byte; replies come from 758 [opendbc]"

[[address]]
family = "any"
at = "7E0"
name = "Engine computer (ECM)"
source = "iso"

[[address]]
family = "any"
at = "7E1"
name = "Gearbox computer (TCM), on most cars"
source = "iso"

[[address]]
family = "any"
at = "7E2"
name = "Third OBD-II computer (often the hybrid system)"
source = "iso"

