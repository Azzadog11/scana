# Vehicle profile: 2024 Daihatsu Hijet Jumbo (S510P). Facts from one truck: a reference scan
# with a handheld scan tool (2026-10-10), a bench test (2026-10-11) and three drives recorded
# with Scana (2026-10-16). A profile matches when a car's engine ECU lists these live PIDs, or
# all but two (see profile::find_match).

id = "daihatsu-hijet-s510p-2024"
name = "2024 Daihatsu Hijet Jumbo"
# Daihatsu is part of the Toyota group: module discovery tries Toyota's address layout
# (data/modules/addresses.toml) until a discovery on the truck shows what is really there.
make = "Daihatsu"
model = "S510P, KF-VE4 658 cc three-cylinder, 4WD 5-speed manual"
bitrate = 500000
addressing = "11-bit"
# From the engine ECU's support masks on the 2026-10-16 drives (BE3FB813, 80042001, 4ADF0000).
# The handheld's list had 41 and lacked 4F and 50.
match_pids = [
  0x01, 0x03, 0x04, 0x05, 0x06, 0x07, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11, 0x13, 0x14, 0x15,
  0x1C, 0x1F, 0x21, 0x2E, 0x33, 0x42, 0x45, 0x47, 0x49, 0x4A, 0x4C, 0x4D, 0x4E, 0x4F, 0x50,
]
default_live = [0x0C, 0x0D, 0x05, 0x42, 0x04, 0x06]
not_reported = "Engine oil temperature, fuel level, outside air temperature and the odometer."

[[ecu]]
id = 0x7E8
name = "Engine (ECM)"

[[note]]
pid = 0x05
text = "Reaches 80 °C about 4.6 minutes after a cold start on the road. The radiator fan cuts in at about 101 °C and the temperature falls back to 88-91 °C (three drives, 2026-10-16). Scana warns at 107 °C and alarms at 112 °C."

[[note]]
pid = 0x42
text = "13.65-14.41 V with the engine running on three drives (2026-10-16); 14.28 V at the 2026-10-10 scan. Scana alarms below 12.8 V or above 15.2 V with the engine running."

[[note]]
pid = 0x0C
text = "About 815 rpm at a warm idle (three drives, 2026-10-16); higher for the first minutes after a cold start."

[[note]]
pid = 0x11
text = "About 14.5 % at a warm idle and about 16 % on a cold fast idle (three drives, 2026-10-16); 18 % at the cold 2026-10-10 scan. Highest 80.8 %: it rises to that and holds flat as the revs climb, so that is as far as this truck's throttle opens. Normal for a reading on the sensor's 5 V scale."

[[note]]
pid = 0x10
text = "2.89 g/s at a cold idle (2026-10-10 scan). Fuel use is roughly g/s x 0.33 litres an hour (estimate)."

[[note]]
pid = 0x33
text = "94 kPa at the 2026-10-10 scan, at about 580 m altitude."

[[limit]]
pid = 0x05
caution_above = 107.0
alarm_above = 112.0

[[limit]]
pid = 0x42
alarm_below = 12.8
alarm_above = 15.2
only_running = true

